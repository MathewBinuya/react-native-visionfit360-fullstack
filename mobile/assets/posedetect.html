<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    #hud { position: absolute; top: 20px; left: 0; right: 0; z-index: 10; text-align: center; color: #fff; font-family: sans-serif; }
    #repcount { font-size: 64px; font-weight: bold; }
    #status { font-size: 18px; }
    #wrap { position: relative; width: 100vw; height: 100vh; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    video { transform: scaleX(-1); }
    canvas { transform: scaleX(-1); }
  </style>
</head>
<body>
  <div id="hud">
    <div id="repcount">0</div>
    <div id="status">Loading model...</div>
  </div>
  <div id="wrap">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
  <script>
    function send(obj) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(obj));
      }
      if (obj.type === 'counter') {
        document.getElementById('repcount').textContent = obj.current_count;
      } else if (obj.type === 'posture') {
        const s = document.getElementById('status');
        s.textContent = obj.message;
        s.style.color = obj.correct ? '#5DCAA5' : '#F09595';
      } else if (obj.type === 'ready') {
        document.getElementById('status').textContent = 'Ready — start squatting';
      } else if (obj.type === 'error') {
        document.getElementById('status').textContent = 'Error: ' + obj.message;
      }
    }

    const params = new URLSearchParams(window.location.search);
    const exercise = params.get('exercise') || 'squat';

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let detector = null;
    let count = 0;
    let stage = 'up';
    let formIsGood = true;

    function angle(a, b, c) {
      const ab = { x: a.x - b.x, y: a.y - b.y };
      const cb = { x: c.x - b.x, y: c.y - b.y };
      const dot = ab.x * cb.x + ab.y * cb.y;
      const magAB = Math.sqrt(ab.x * ab.x + ab.y * ab.y);
      const magCB = Math.sqrt(cb.x * cb.x + cb.y * cb.y);
      return Math.acos(dot / (magAB * magCB)) * (180 / Math.PI);
    }

    function kp(keypoints, name) {
      return keypoints.find(k => k.name === name);
    }

    function checkSquat(keypoints) {
      const hip = kp(keypoints, 'left_hip');
      const knee = kp(keypoints, 'left_knee');
      const ankle = kp(keypoints, 'left_ankle');
      const shoulder = kp(keypoints, 'left_shoulder');

      if (!hip || !knee || !ankle || !shoulder) { formIsGood = false; return; }
      if (hip.score < 0.3 || knee.score < 0.3 || ankle.score < 0.3) { formIsGood = false; return; }

      const kneeAngle = angle(hip, knee, ankle);
      const backAngle = angle(shoulder, hip, knee);
      const backOk = backAngle > 60;
      formIsGood = backOk;

      send({ type: 'posture', message: backOk ? 'Good form' : 'Keep your back straighter', correct: backOk });

      if (kneeAngle < 100 && stage === 'up' && backOk) {
        stage = 'down';
      }
      if (kneeAngle > 160 && stage === 'down') {
        stage = 'up';
        count++;
        send({ type: 'counter', current_count: count });
      }
    }

    async function detectLoop() {
      if (detector && video.readyState === 4) {
        const poses = await detector.estimatePoses(video);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (poses.length > 0) {
          const keypoints = poses[0].keypoints;
          ctx.fillStyle = formIsGood ? '#1D9E75' : '#E24B4A';
          keypoints.forEach(k => {
            if (k.score > 0.3) {
              ctx.beginPath();
              ctx.arc(k.x, k.y, 6, 0, 2 * Math.PI);
              ctx.fill();
            }
          });
          if (exercise === 'squat') checkSquat(keypoints);
        }
      }
      requestAnimationFrame(detectLoop);
    }

    async function init() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        video.srcObject = stream;
        await new Promise(r => { video.onloadedmetadata = r; });
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        await tf.ready();
        detector = await poseDetection.createDetector(
          poseDetection.SupportedModels.MoveNet,
          { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING }
        );
        send({ type: 'ready' });
        detectLoop();
      } catch (err) {
        send({ type: 'error', message: err.message });
      }
    }
    init();
  </script>
</body>
</html>
