        if (armAngle > a.extreme) a.extreme = armAngle;       // new highest raise
        tally();
        // Half-rep bounce: started to lower then raised again without returning to the bottom.
        if (armAngle < C.up - 10) a.partialDown = true;
        else if (a.partialDown && armAngle > C.up) { a.bounceUntil = NOW + 900; a.partialDown = false; }
        if (armAngle < C.down) finishRaise(side, arms, C);    // lowered -> finish the rep
        else if (NOW - a.activeStart > C.maxActiveMs) resetRaiseArm(a);
      }
      const faultLive = a.active && a.faultSince && (NOW - a.faultSince >= RAISE_FAULT_MS);
      return { visible: true, armAngle, elbowAngle: Math.round(elbowAngle), dir, dirBad, elbowBad, tooHigh,
               active: a.active, faultLive, faultReason: a.faultReason };
    }

    /* =========================================================================
       INDEPENDENT PER-LIMB REP ENGINE (tricep extension, side leg raise, high knees,
       and the EITHER-arm bicep curl, front raise and lateral raise)
       Each limb (left/right) runs its OWN rep state machine. A finished rep either
       counts alone or, for two-limb-together movements (pair:true), pairs with the
       OPPOSITE limb into a single rep — using per-limb START times, not one shared
       merge timer (the old countEither cascaded and swallowed reps on fast
       alternation, and one side could eat the other's rep).
       Missing-landmark handling is tolerant: a limb is only abandoned after a real
       POSE_GAP_MS dropout (not a single flickered frame), and a lower visibility gate
       (kpL) keeps far-side limbs usable — that is what fixes "only left counts".
       ========================================================================= */
    // Lower visibility gate than kp() (0.5) — a far-side limb turned from the camera
    // often reads 0.3–0.5 and must still be usable for counting.
    const LIMB_MIN_VIS = 0.3;
    function kpL(keypoints, name) {
      const k = keypoints.find((k) => k.name === name);
      if (!k) return undefined;
      if (COUNT_MIN_VIS && (k.score ?? 1) < LIMB_MIN_VIS) return undefined;   // ?gate=0 disables the gate
      return k;
    }

    const PAIR_START_MS = 450;    // two limbs that STARTED within this are one both-limb rep
    const PAIR_WAIT_MS  = 1500;   // a pending limb waits at most this for its partner, then counts alone

    function makeLimb() {
      return {
        stage: 'ready', activeStart: 0, activeFrames: 0, evalFrames: 0, badFrames: 0,
        extreme: null, lastSeenMs: 0, lastCountMs: 0,
        pending: false, finStart: 0, finEnd: 0, finOk: true, finReason: '',
      };
    }
    const triArms = { left: makeLimb(), right: makeLimb() };   // tricep extension
    const slrLegs = { left: makeLimb(), right: makeLimb() };   // side leg raise
    const hkLegs  = { left: makeLimb(), right: makeLimb() };   // high knees

    // Active-ness that works for BOTH per-limb states (`stage`) and the raise-arm
    // objects (`active` boolean), so finishLimb/flushPending serve the lateral raise too.
    function limbActive(x) { return x.stage === 'active' || x.active === true; }

    // Abandon an in-progress rep (no count, no bad rep). Used by the no-person gap
    // branch and by sideMissing.
    function abandonSideRep(st) { if (st && st.stage === 'active') { st.stage = 'ready'; st.extreme = null; st.pending = false; } }

    // A limb whose landmarks are missing THIS frame: keep its rep alive through brief
    // dropout; only abandon once it's been gone longer than POSE_GAP_MS.
    function sideMissing(st) {
      if (st.stage === 'active' && st.lastSeenMs && NOW - st.lastSeenMs > POSE_GAP_MS) abandonSideRep(st);
    }

    // Count a finished limb rep, pairing opposite limbs that STARTED together into ONE rep.
    function finishLimb(limbs, side, startMs, ok, reason, opts) {
      const a = limbs[side], o = limbs[side === 'left' ? 'right' : 'left'];
      opts = opts || {};
      const debounceMs = opts.debounceMs || 300;
      if (NOW - (a.lastCountMs || 0) < debounceMs) return;      // per-limb debounce
      if (opts.pair) {
        const startedTogether = o.activeStart && Math.abs(startMs - o.activeStart) <= PAIR_START_MS;
        if (startedTogether) {
          if (o.pending) {                                       // partner already finished → ONE rep
            o.pending = false;
            a.lastCountMs = o.lastCountMs = NOW;
            if (ok && o.finOk) rep(); else badRep(ok ? o.finReason : reason);
            return;
          }
          if (limbActive(o)) {                                   // partner still moving → wait for it
            a.pending = true; a.finStart = startMs; a.finEnd = NOW; a.finOk = ok; a.finReason = reason;
            return;
          }
        }
      }
      a.lastCountMs = NOW;                                       // count this limb alone
      if (ok) rep(); else badRep(reason);
    }

    // Every frame: a pending limb counts alone once its partner is no longer active
    // (it never started a matching rep), or after PAIR_WAIT_MS (partner never came).
    function flushPending(limbs) {
      ['left', 'right'].forEach((side) => {
        const a = limbs[side], o = limbs[side === 'left' ? 'right' : 'left'];
        if (!a.pending) return;
        if ((!limbActive(o) && !o.pending) || NOW - a.finEnd > PAIR_WAIT_MS) {
          a.pending = false; a.lastCountMs = NOW;
          if (a.finOk) rep(); else badRep(a.finReason);
        }
      });
    }

    // Advance ONE limb's single-metric rep state machine (hysteresis + extreme +
    // form-evidence), finishing via finishLimb. Completeness uses activeWhenBelow
    // (min vs max). maxActiveMs abandons a rep stuck active (limb never returned).
    function runSideRep(limbs, side, opts) {
      const st = limbs[side];
      const below = opts.activeWhenBelow, m = opts.metric;
      st.lastSeenMs = NOW;
      if (st.stage === 'active') {
        st.activeFrames++;
        if (opts.formEvaluable) { st.evalFrames++; if (opts.formBad) st.badFrames++; }
        if (m !== undefined && m !== null) {
          if (st.extreme === null) st.extreme = m;
          else st.extreme = below ? Math.min(st.extreme, m) : Math.max(st.extreme, m);
        }
        if (NOW - st.activeStart > (opts.maxActiveMs || 8000)) { abandonSideRep(st); return; }  // stuck → abandon
      }
      const entering = below ? (m < opts.enter) : (m > opts.enter);
      const exiting  = below ? (m > opts.exit)  : (m < opts.exit);
      if (st.stage === 'ready' && entering) {
        st.stage = 'active'; st.activeStart = NOW;
        st.activeFrames = 1; st.evalFrames = 0; st.badFrames = 0; st.extreme = (m !== undefined ? m : null);
        if (opts.formEvaluable) { st.evalFrames = 1; if (opts.formBad) st.badFrames = 1; }
      } else if (st.stage === 'active' && exiting) {
        st.stage = 'ready';
        if (st.activeFrames < (opts.minActiveFrames || 2)) return;   // too short to be a real rep
        let complete = true, reason = '';
        if (opts.target !== undefined && st.extreme !== null) {
          complete = below ? st.extreme <= opts.target : st.extreme >= opts.target;
          if (!complete) reason = opts.incompleteMsg || 'Incomplete rep';
        }
        const badRatio = st.evalFrames ? st.badFrames / st.evalFrames : 0;
        const formBad = st.evalFrames >= (opts.minEvalFrames || 3) && badRatio > (opts.badRatio || 0.4);
        const ok = complete && !formBad;
        finishLimb(limbs, side, st.activeStart, ok, reason || opts.formMsg, { pair: opts.pair, debounceMs: opts.debounceMs });
      }
    }

    /* =========================================================================
       PUSH-UP — SIDE-VIEW-FIRST form + depth validation.
       A push-up is best judged from the SIDE (a clear profile of shoulder, hip, knee,
       ankle and the near arm). So the detector first checks the camera view and landmark
       reliability; if the user is front-on or the body is not fully/ reliably visible it
       reports UNKNOWN with a setup hint and will NOT count. Depth uses the VISIBLE side's
       arm only (never an average of an occluded far arm). Body alignment is an OBSERVABLE
       posture proxy — the hip's offset from the shoulder->ankle line (sag vs pike) — NOT a
       spine measurement (MediaPipe has no spine landmarks). Thresholds are tuned against the
       old detector's angle convention. This keeps the shared runRep engine for the state
       machine (TOP -> DESCENDING -> VALID_BOTTOM -> ASCENDING -> TOP) and its hysteresis.
       ========================================================================= */
    const PUSHUP = {
      enterElbow: 140,     // elbow angle (shoulder-elbow-wrist) below this => descending (active)
      exitElbow: 152,      // elbow back above this => returned to TOP; a rep can finish (must lock out)
      bottomElbow: 100,    // elbow must bend to <= this at the bottom for enough depth (no shallow reps)
      sagMax: 0.13,        // hip BELOW the shoulder->ankle line by this fraction of body length = sag
      pikeMax: 0.13,       // hip ABOVE that line by this fraction = pike (hips too high)
      headMax: 0.30,       // head off the torso line by this fraction of torso length = head dropped
      sideRatioMax: 0.48,  // |left_shoulder.x - right_shoulder.x| / torso above this = too front-on
      debounceMs: 350, minEvalFrames: 4, badRatio: 0.45,
    };
    // Signed offset of the hip from the shoulder->end line, normalized by body length.
    // + = hip toward the floor (SAG), - = hip above the line (PIKE). Uses image Y (down is reliable).
    function pushupSag(sh, hip, end) {
      const bx = end.x - sh.x, by = end.y - sh.y;
      const len2 = bx * bx + by * by;
      if (len2 < 1) return 0;
      const t = ((hip.x - sh.x) * bx + (hip.y - sh.y) * by) / len2;
      const lineY = sh.y + t * by;
      return (hip.y - lineY) / Math.sqrt(len2);
    }
    // Perpendicular distance of the head from the hip->shoulder line, normalized by torso length.
    function pushupHeadOff(head, sh, hip) {
      const tx = sh.x - hip.x, ty = sh.y - hip.y;
      const len = Math.hypot(tx, ty);
      if (len < 1) return 0;
      return Math.abs((head.x - sh.x) * ty - (head.y - sh.y) * tx) / (len * len);
    }

    /* =========================================================================
       EXERCISE DETECTORS
       Each sets form state every frame (good/bad/unknown) and drives the rep engine.
       ========================================================================= */
    const EXERCISES = {

      // 1. SQUAT — meaningful depth + complete movement; trunk lean handled separately.
      squat: function (keypoints) {
        const S = pickSide(keypoints, ['hip', 'knee', 'ankle']);
        const hip = kp(keypoints, S + '_hip'), knee = kp(keypoints, S + '_knee');
        const ankle = kp(keypoints, S + '_ankle'), shoulder = kp(keypoints, S + '_shoulder');
        if (!(hip && knee && ankle)) { setForm('unknown'); debugEl.textContent = 'legs unclear'; return; }
        const kneeAngle = smoothV('squat_knee', ang(hip, knee, ankle));
        lastAngle = kneeAngle;
        // Trunk lean = torso deviation from vertical (kept separate from depth).
        const leanEvaluable = !!shoulder;
        const leanDeg = shoulder ? verticalDeg(shoulder, hip) : 0;
        const leanBad = leanEvaluable && leanDeg > 45;
        setForm(leanEvaluable ? (leanBad ? 'bad' : 'good') : 'unknown', 'Keep your chest up');
        debugEl.textContent = 'KNEE:' + Math.round(kneeAngle) + ' LEAN:' + Math.round(leanDeg) + '° ' + R.stage + ' good:' + count + ' bad:' + badCount + ' side:' + S;
        runRep({ metric: kneeAngle, activeWhenBelow: true, enter: 140, exit: 150, target: 100,
          incompleteMsg: 'Go deeper', formMsg: 'Keep your chest up', formEvaluable: leanEvaluable, formBad: leanBad,
          debounceMs: 300, onActive: () => sayActive('Stand up') });
      },

      // 2. SUMO SQUAT — a WIDE stance is the whole point, so a narrow (feet-together) squat must
      // NOT count. A rep can only START when the ankles are clearly wider than the hips, measured
      // front-on (both ankles + both hips visible). Depth/lean logic is otherwise the same as squat.
      sumosquat: function (keypoints) {
        // Feet must be wider than this multiple of the hip width to qualify as a sumo stance.
        // Shoulder-width (normal squat) sits ~1.4-1.6x hip width, so 1.7 rejects it; tune on-device.
        const SUMO_STANCE_RATIO = 1.7;
        const S = pickSide(keypoints, ['hip', 'knee', 'ankle']);
        const hip = kp(keypoints, S + '_hip'), knee = kp(keypoints, S + '_knee');
        const ankle = kp(keypoints, S + '_ankle'), shoulder = kp(keypoints, S + '_shoulder');
        if (!(hip && knee && ankle)) { setForm('unknown'); debugEl.textContent = 'show your legs'; return; }
        const kneeAngle = smoothV('sumo_knee', ang(hip, knee, ankle));
        lastAngle = kneeAngle;
        const leanEvaluable = !!shoulder;
        const leanDeg = shoulder ? verticalDeg(shoulder, hip) : 0;
        const leanBad = leanEvaluable && leanDeg > 45;

        // STANCE GATE — needs both ankles and both hips (front-on). If we can't see them, or the
        // feet aren't wide enough, the rep is blocked from starting so it can never be counted.
        const la = kp(keypoints, 'left_ankle'), ra = kp(keypoints, 'right_ankle');
        const lh = kp(keypoints, 'left_hip'),   rh = kp(keypoints, 'right_hip');
        const stanceMeasurable = !!(la && ra && lh && rh);
        const hipSpread = stanceMeasurable ? Math.max(Math.abs(lh.x - rh.x), 1) : 0;
        const stanceRatio = stanceMeasurable ? Math.abs(la.x - ra.x) / hipSpread : 0;
        const stanceWide = stanceMeasurable && stanceRatio > SUMO_STANCE_RATIO;

        setForm(leanEvaluable ? (leanBad ? 'bad' : 'good') : 'unknown', 'Keep your chest up');
        debugEl.textContent = 'KNEE:' + Math.round(kneeAngle) + ' LEAN:' + Math.round(leanDeg) + '° stance:' +
          (stanceMeasurable ? stanceRatio.toFixed(2) + (stanceWide ? ' WIDE' : ' narrow') : '?') +
          ' ' + R.stage + ' good:' + count + ' bad:' + badCount + ' side:' + S;
        // Nudge to widen the stance only while standing, so we don't nag mid-rep.
        if (!stanceWide && R.stage === 'ready') sayActive(stanceMeasurable ? 'Step your feet wider' : 'Face the camera, feet in view');
        runRep({ metric: kneeAngle, activeWhenBelow: true, enter: 150, exit: 160, target: 110,
          incompleteMsg: 'Go deeper', formMsg: 'Keep your chest up', formEvaluable: leanEvaluable, formBad: leanBad,
          canStart: stanceWide,
          debounceMs: 300, onActive: () => sayActive('Stand up') });
      },

      // 3. BICEP CURL — EITHER arm (per-arm engine above). Single-arm, alternating and both-arm
      // (paired -> one rep) curls all count; form + feedback are per arm so a stationary arm never
      // spoils the moving one. ?arm=left / ?arm=right restricts to one arm.
      bicepcurl: function (keypoints) {
        // Shared upper-body "english": horizontal drift of the shoulder line vs a slow
        // baseline, normalized by body scale. Body sway is a whole-body cheat (not an arm),
        // so it's evaluated once and applied to whichever arm is curling.
        const ls = kp(keypoints, 'left_shoulder'), rs = kp(keypoints, 'right_shoulder');
        let bodySway = false;
        if (ls && rs) {
          const cx = (ls.x + rs.x) / 2;
          const ref = ema['curl_bodyRef'] === undefined ? cx : ema['curl_bodyRef'];
          bodySway = Math.abs(cx - ref) > CURL.bodySwayPx * bodyScale;
          ema['curl_bodyRef'] = ref * 0.92 + cx * 0.08;  // slow baseline so a real sway deviates from it
        }

        // A disabled arm (?arm=) is never advanced -> treated as not visible, so it can't count/pair/flag.
        const L = armEnabled('left') ? updateCurlArm('left', keypoints, bodySway) : { visible: false };
        const Rn = armEnabled('right') ? updateCurlArm('right', keypoints, bodySway) : { visible: false };
        flushPending(curlArms);   // count a lone arm once its partner isn't coming

        // lastAngle fallback = the more-flexed visible elbow (used by the angle helpers).
        if (L.visible && Rn.visible) lastAngle = Math.min(L.elbowAngle, Rn.elbowAngle);
        else if (L.visible) lastAngle = L.elbowAngle;
        else if (Rn.visible) lastAngle = Rn.elbowAngle;

        // ---- combine the two independent arms into one border/message ----
        // commitForm() smooths this temporally, so per-frame flicker never flips the border.
        if (!L.visible && !Rn.visible) {                 // neither arm reliable -> UNKNOWN (never fake-good)
          setFormRaw('unknown', '');
          debugEl.textContent = 'arm(s) unclear — show your arm(s)';
          return;
        }
        // Border red ONLY on a SUSTAINED fault (faultLive) — the SAME signal that fails the rep in
        // finishCurl — so red agrees with the count: a transient elbow wobble no longer flashes red
        // while the rep still counts. (Mirrors the lateral/front raise engine.)
        const fault = (L.visible && L.faultLive) ? L.faultReason : (Rn.visible && Rn.faultLive) ? Rn.faultReason : '';
        if (fault) setForm('bad', fault);
        else setForm('good');                            // >=1 arm visible, no sustained fault
        debugEl.textContent = 'arm:' + ARM_SEL
          + ' L:' + (L.visible ? Math.round(L.elbowAngle) : '-') + '(' + curlArms.left.phase + ')'
          + ' R:' + (Rn.visible ? Math.round(Rn.elbowAngle) : '-') + '(' + curlArms.right.phase + ')'
          + ' good:' + count + ' bad:' + badCount + (bodySway ? ' SWAY' : '');
      },

      // 4. LATERAL RAISE — left/right arms tracked on the shared per-arm engine (config LAT) with
      // SIDEWAYS-direction validation. A raise only counts if the arm travelled OUT TO THE SIDE;
      // a forward/backward swing, a too-bent elbow or raising above the shoulder are faults.
      // EITHER-arm counting (mode:'either'): two arms that START together pair into ONE rep, a lone
      // arm counts on its own via flushPending(latArms). The live red border uses the SAME
      // sustained-fault signal that fails the rep, so they agree.
      lateralraise: function (keypoints) {
        // Shared torso swing (body english): horizontal drift of the shoulder line vs a slow
        // baseline, torso-normalized. Not arm-specific, so evaluated once per frame.
        const ls = kp(keypoints, 'left_shoulder'), rs = kp(keypoints, 'right_shoulder');
        let bodySway = false;
        if (ls && rs) {
          const cx = (ls.x + rs.x) / 2;
          const ref = ema['lr_bodyRef'] === undefined ? cx : ema['lr_bodyRef'];
          bodySway = Math.abs(cx - ref) > LAT.bodySwayPx * bodyScale;
          ema['lr_bodyRef'] = ref * 0.92 + cx * 0.08;
        }

        // A disabled arm (?arm=) is never advanced -> treated as not visible, so it can't count/pair/flag.
        const L = armEnabled('left') ? updateRaiseArm('left', latArms, keypoints, bodySway, LAT) : { visible: false };
        const Rn = armEnabled('right') ? updateRaiseArm('right', latArms, keypoints, bodySway, LAT) : { visible: false };
        flushPending(latArms);   // count a lone arm once its partner isn't coming

        if (L.visible && Rn.visible) lastAngle = Math.max(L.armAngle, Rn.armAngle);
        else if (L.visible) lastAngle = L.armAngle;
        else if (Rn.visible) lastAngle = Rn.armAngle;

        // ---- combine the two independent arms into one border/message (commitForm smooths it) ----
        if (!L.visible && !Rn.visible) {                 // neither arm reliable -> UNKNOWN (never fake-good)
          setFormRaw('unknown', '');
          debugEl.textContent = 'show your arm(s) — face the camera';
          return;
        }
        // Border red ONLY on a SUSTAINED fault (faultLive) — the same signal that fails the rep.
        const fault = (L.visible && L.faultLive) ? L.faultReason : (Rn.visible && Rn.faultLive) ? Rn.faultReason : '';
        if (fault) setForm('bad', fault);
        else setForm('good');
        debugEl.textContent = 'arm:' + ARM_SEL
          + ' L:' + (L.visible ? Math.round(L.armAngle) + '/' + L.dir + '/' + L.elbowAngle : '-')
          + ' R:' + (Rn.visible ? Math.round(Rn.armAngle) + '/' + Rn.dir + '/' + Rn.elbowAngle : '-')
          + ' good:' + count + ' bad:' + badCount + (bodySway ? ' SWAY' : '');
      },

      // 5. FRONT RAISE — left/right arms on the shared per-arm engine (config FRONT) with FORWARD-
      // direction validation. A raise only counts if the arm travelled FORWARD in front of the body;
      // lateral/backward raises, a too-bent elbow, or a forearm-only (curl-like) motion are faults.
      // EITHER-arm counting (mode:'either'): one arm counts alone, two arms that START together pair
      // into ONE rep (via flushPending(fraiseArms)). The live red border uses the SAME sustained-fault
      // signal that fails the rep, so red and the count never disagree. ?arm= restricts to one arm.
      frontraise: function (keypoints) {
        // Shared torso swing (body english): horizontal drift of the shoulder line vs a slow
        // baseline, torso-normalized. Not arm-specific, so evaluated once per frame.
        const ls = kp(keypoints, 'left_shoulder'), rs = kp(keypoints, 'right_shoulder');
        let bodySway = false;
        if (ls && rs) {
          const cx = (ls.x + rs.x) / 2;
          const ref = ema['fr_bodyRef'] === undefined ? cx : ema['fr_bodyRef'];
          bodySway = Math.abs(cx - ref) > FRONT.bodySwayPx * bodyScale;
          ema['fr_bodyRef'] = ref * 0.92 + cx * 0.08;
        }

        // A disabled arm (?arm=) is never advanced -> treated as not visible, so it can't count/pair/flag.
        const L = armEnabled('left') ? updateRaiseArm('left', fraiseArms, keypoints, bodySway, FRONT) : { visible: false };
        const Rn = armEnabled('right') ? updateRaiseArm('right', fraiseArms, keypoints, bodySway, FRONT) : { visible: false };
        flushPending(fraiseArms);   // count a lone arm once its partner isn't coming

        if (L.visible && Rn.visible) lastAngle = Math.max(L.armAngle, Rn.armAngle);
        else if (L.visible) lastAngle = L.armAngle;
        else if (Rn.visible) lastAngle = Rn.armAngle;

        // ---- combine the two independent arms into one border/message (commitForm smooths it) ----
        if (!L.visible && !Rn.visible) {                 // neither arm reliable -> UNKNOWN (never fake-good)
          setFormRaw('unknown', '');
          debugEl.textContent = 'face camera — show your arm(s)';
          return;
        }
        // Border red ONLY on a SUSTAINED fault (faultLive) — the same signal that fails the rep, so
        // a correct front raise is never briefly flagged red while still counting green.
        const fault = (L.visible && L.faultLive) ? L.faultReason : (Rn.visible && Rn.faultLive) ? Rn.faultReason : '';
        if (fault) setForm('bad', fault);
        else setForm('good');
        debugEl.textContent = 'arm:' + ARM_SEL
          + ' L:' + (L.visible ? Math.round(L.armAngle) + '/' + L.dir + '/' + L.elbowAngle : '-')
          + ' R:' + (Rn.visible ? Math.round(Rn.armAngle) + '/' + Rn.dir + '/' + Rn.elbowAngle : '-')
          + ' good:' + count + ' bad:' + badCount + (bodySway ? ' SWAY' : '');
      },

      // 6. SHOULDER PRESS — requires a real lockout (max extension) to count as valid.
      shoulderpress: function (keypoints) {
        const S = pickSide(keypoints, ['shoulder', 'elbow', 'wrist']);
        const shoulder = kp(keypoints, S + '_shoulder'), elbow = kp(keypoints, S + '_elbow'), wrist = kp(keypoints, S + '_wrist');
        if (!(shoulder && elbow && wrist)) { setForm('unknown'); debugEl.textContent = 'arm unclear — face camera'; return; }
        const elbowAngle = smoothV('press_elbow', ang(shoulder, elbow, wrist));
        lastAngle = elbowAngle;
        // FORM: press both arms evenly — a measurable fault in the usual front-on view.
        const lw = kp(keypoints, 'left_wrist'), rw = kp(keypoints, 'right_wrist');
        const ls = kp(keypoints, 'left_shoulder'), rs = kp(keypoints, 'right_shoulder');
        const symEval = !!(lw && rw && ls && rs);
        const symBad = symEval && Math.abs(lw.y - rw.y) > Math.max(Math.abs(ls.x - rs.x), 1) * 0.5;
        setForm(symEval ? (symBad ? 'bad' : 'good') : 'good', 'Press both arms evenly');
        debugEl.textContent = 'ELBOW:' + Math.round(elbowAngle) + ' even:' + (symEval ? !symBad : '-') + ' ' + R.stage + ' good:' + count + ' bad:' + badCount + ' side:' + S;
        runRep({ metric: elbowAngle, activeWhenBelow: false, enter: 130, exit: 110, target: 160,
          incompleteMsg: 'Fully extend your arms', formMsg: 'Press both arms evenly', formEvaluable: symEval, formBad: symBad,
          minEvalFrames: 4, badRatio: 0.5, debounceMs: 300, onActive: () => sayActive('Press up') });
      },

      // 7. TRICEP EXTENSION (overhead) — each arm counted on its OWN limb machine; two hands
      // on one dumbbell (arms start together) pair into ONE rep, a single arm counts alone.
      // An arm is only TRACKED while the elbow is raised overhead, so a hanging arm can't sit
      // "active" forever or produce a phantom rep when you switch sides. Uses kpL (lower vis
      // gate) + sideMissing so the far arm's reps aren't abandoned on a flickered wrist.
      tricepextension: function (keypoints) {
        const torso = torsoPx || 120;   // body-scale reference in px (fallback if scale is off)
        let anyTracked = false, fault = '';
        const dbg = { left: '-', right: '-' };
        ['left', 'right'].forEach((side) => {
          const shoulder = kpL(keypoints, side + '_shoulder'), elbow = kpL(keypoints, side + '_elbow');
          const wrist = kpL(keypoints, side + '_wrist');
          if (!(shoulder && elbow)) { sideMissing(triArms[side]); return; }   // can't judge arm position
          // POSITION gate: only track an overhead arm (elbow at/above ~shoulder height).
          const raised = elbow.y < shoulder.y + 0.25 * torso;
          if (!raised) { abandonSideRep(triArms[side]); ema['tri_swingRef_' + side] = undefined; return; }
          if (!wrist) { sideMissing(triArms[side]); dbg[side] = '··(' + triArms[side].stage[0] + ')'; return; }  // keep rep alive
          anyTracked = true;
          const elbowAngle = smoothV('tri_elbow_' + side, ang(shoulder, elbow, wrist));
          lastAngle = elbowAngle;
          const hip = kpL(keypoints, side + '_hip');
          const swingEvaluable = !!hip;
          const swing = swingEvaluable ? ang(hip, shoulder, elbow) : 0;
          const refKey = 'tri_swingRef_' + side;
          const ref = ema[refKey] === undefined ? swing : ema[refKey];
          const swingBad = swingEvaluable && Math.abs(swing - ref) > 35;
          ema[refKey] = ref * 0.95 + swing * 0.05;
          if (swingBad) fault = 'Keep your upper arm still';
          runSideRep(triArms, side, { metric: elbowAngle, activeWhenBelow: false,
            enter: 130, exit: 110, target: 150,   // target 150: a real on-camera lockout reads ~150-160°
            incompleteMsg: 'Extend fully', formMsg: 'Keep your upper arm still',
            formEvaluable: swingEvaluable, formBad: swingBad,
            minActiveFrames: 2, minEvalFrames: 3, badRatio: 0.4, debounceMs: 400, pair: true, maxActiveMs: 8000 });
          dbg[side] = Math.round(elbowAngle) + '(' + triArms[side].stage[0] + ')';
        });
        flushPending(triArms);
        if (!anyTracked) setForm('unknown', '');
        else setForm(fault ? 'bad' : 'good', fault || 'Keep your upper arm still');
        debugEl.textContent = 'TRI L:' + dbg.left + ' R:' + dbg.right + ' good:' + count + ' bad:' + badCount;
      },

      // 8. PUSH-UP — elbow depth AND body-line (temporally confirmed), with UNKNOWN support.
      pushup: function (keypoints) {
        // Abandon any in-progress rep and report UNKNOWN (never counts) when the view/landmarks
        // can't support a reliable side-view judgement.
        const unknownView = (msg) => {
          setFormRaw('unknown', msg);
          if (R.stage === 'active') { R.stage = 'ready'; R.extreme = null; R.readySinceMs = NOW; }
          debugEl.textContent = 'pushup: ' + msg + ' ' + R.stage + ' good:' + count + ' bad:' + badCount;
        };

        const S = pickSide(keypoints, ['shoulder', 'elbow', 'wrist', 'hip', 'knee', 'ankle']);
        const sh = kp(keypoints, S + '_shoulder'), hip = kp(keypoints, S + '_hip');
        if (!(sh && hip)) { unknownView('Adjust your position so your shoulders and hips are visible'); return; }

        // ---- SIDE-VIEW GATE (push-up specific) ----
        // In a side view the two shoulders overlap horizontally in the image (their separation is
        // mostly depth), so a SMALL image shoulder-separation / torso ratio = side-on. A large one =
        // front/top-on, where push-up alignment & depth can't be judged reliably. If the far shoulder
        // is occluded we can't compute it — that itself implies a side view, so we allow it.
        const torsoPxLocal = Math.hypot(sh.x - hip.x, sh.y - hip.y);
        const lsh = kpRaw(keypoints, 'left_shoulder'), rsh = kpRaw(keypoints, 'right_shoulder');
        if (lsh && rsh && (lsh.score ?? 1) >= 0.5 && (rsh.score ?? 1) >= 0.5 && torsoPxLocal > 1) {
          if (Math.abs(lsh.x - rsh.x) / torsoPxLocal > PUSHUP.sideRatioMax) { unknownView('Turn sideways to the camera'); return; }
        }

        // ---- LANDMARK RELIABILITY for the visible side ----
        const el = kp(keypoints, S + '_elbow'), wr = kp(keypoints, S + '_wrist');
        if (!(el && wr)) { unknownView('Keep your shoulder, elbow and wrist visible'); return; }
        const ankle = kp(keypoints, S + '_ankle'), knee = kp(keypoints, S + '_knee');
        const end = ankle || knee;                                  // far end of the body line
        if (!end) { unknownView('Move farther back so your full body is visible'); return; }

        // ---- DEPTH (visible side's arm only; never an occluded average) ----
        const elbowAngle = smoothV('push_elbow_' + S, ang(sh, el, wr));
        lastAngle = elbowAngle;

        // ---- BODY ALIGNMENT (observable posture proxy, not spine) ----
        const sag = smoothV('push_sag', pushupSag(sh, hip, end));   // + sag / - pike
        const head = bestHead(keypoints, S);
        const headOff = head ? smoothV('push_head', pushupHeadOff(head.pt, sh, hip)) : 0;
        let formBad = false, msg = 'Keep your body in a straight line';
        if (sag > PUSHUP.sagMax) { formBad = true; msg = 'Keep your hips from sagging'; }
        else if (sag < -PUSHUP.pikeMax) { formBad = true; msg = 'Lower your hips — keep your body straight'; }
        else if (head && headOff > PUSHUP.headMax) { formBad = true; msg = 'Keep your head aligned with your torso'; }
        setForm(formBad ? 'bad' : 'good', msg);

        debugEl.textContent = 'ELBOW:' + Math.round(elbowAngle) + ' SAG:' + sag.toFixed(2) +
          ' HEAD:' + headOff.toFixed(2) + ' ' + R.stage + ' good:' + count + ' bad:' + badCount + ' side:' + S;

        runRep({ metric: elbowAngle, activeWhenBelow: true, enter: PUSHUP.enterElbow, exit: PUSHUP.exitElbow, target: PUSHUP.bottomElbow,
          incompleteMsg: 'Lower your body further', formMsg: msg, formEvaluable: true, formBad,
          minEvalFrames: PUSHUP.minEvalFrames, badRatio: PUSHUP.badRatio, debounceMs: PUSHUP.debounceMs, onActive: () => sayActive('Push up') });
      },

      // 9. JUMPING JACK — meaningful OPEN -> CLOSED cycle, leg spread normalized to hip width.
      jumpingjack: function (keypoints) {
        const lw = kp(keypoints, 'left_wrist'), rw = kp(keypoints, 'right_wrist'), nose = kp(keypoints, 'nose');
        const la = kp(keypoints, 'left_ankle'), ra = kp(keypoints, 'right_ankle');
        const lh = kp(keypoints, 'left_hip'), rh = kp(keypoints, 'right_hip');
        if (!(lw && rw && nose && la && ra && lh && rh)) { setForm('unknown'); debugEl.textContent = 'show your WHOLE body'; return; }
        const handsUp = (lw.y < nose.y) && (rw.y < nose.y);
        const hipSpread = Math.max(Math.abs(lh.x - rh.x), 1);
        const legsApart = Math.abs(la.x - ra.x) > hipSpread * 1.6;
        const open = handsUp && legsApart, closed = !handsUp && !legsApart;
        // FORM: arms and legs should move TOGETHER. Sustained desync (hands up but legs closed,
        // or vice versa) = a sloppy jack -> red + rejected rep. Brief transitions are tolerated.
        const outOfSync = handsUp !== legsApart;
        setForm(outOfSync ? 'bad' : 'good', 'Move your arms and legs together');
        debugEl.textContent = 'hands:' + handsUp + ' legs:' + legsApart + ' ' + R.stage + ' good:' + count + ' bad:' + badCount;
        if (R.stage === 'active') repFrame(true, outOfSync);
        if (R.stage === 'ready' && open) repStart(() => sayActive('Close'));
        else if (R.stage === 'active' && closed) repFinish({ debounceMs: 250, minActiveFrames: 2, minEvalFrames: 3, badRatio: 0.6, formMsg: 'Move your arms and legs together' });
      },

      // 10. HIGH KNEES — each knee on its OWN limb machine (pair:false) so alternating knees
      // both count. Metric is a TORSO-NORMALIZED knee drop below the hip line (standing ≈ 0.9,
      // thigh at hip height ≈ 0), so it's body-scale/distance invariant. Uses kpL + sideMissing
      // and whichever hips are visible (not both required).
      highknees: function (keypoints) {
        const lh = kpL(keypoints, 'left_hip'), rh = kpL(keypoints, 'right_hip');
        const hips = [lh, rh].filter(Boolean);
        if (!hips.length) {
          sideMissing(hkLegs.left); sideMissing(hkLegs.right);   // keep in-progress reps alive through brief loss
          setForm('unknown'); debugEl.textContent = 'show your full body'; return;
        }
        const hipY = hips.reduce((t, h) => t + h.y, 0) / hips.length;
        const hipX = hips.reduce((t, h) => t + h.x, 0) / hips.length;
        // torso reference (px): smoothed body scale, else shoulder→hip distance, else a constant.
        const ls = kpL(keypoints, 'left_shoulder'), rs = kpL(keypoints, 'right_shoulder');
        const shoulders = [ls, rs].filter(Boolean);
        const shX = shoulders.length ? shoulders.reduce((t, s) => t + s.x, 0) / shoulders.length : null;
        const shY = shoulders.length ? shoulders.reduce((t, s) => t + s.y, 0) / shoulders.length : null;
        const torsoRef = torsoPx || (shY !== null ? Math.hypot(shX - hipX, shY - hipY) : 120);
        // FORM: stay tall — leaning the torso back to throw the knee up = a cheat (needs both shoulders).
        const leanEval = shoulders.length === 2;
        const leanDeg = leanEval ? verticalDeg({ x: shX, y: shY }, { x: hipX, y: hipY }) : 0;
        const leanBad = leanEval && leanDeg > 28;
        const dbg = { left: '-', right: '-' };
        let anyKnee = false;
        ['left', 'right'].forEach((side) => {
          const knee = kpL(keypoints, side + '_knee');
          if (!knee) { sideMissing(hkLegs[side]); return; }
          anyKnee = true;
          // drop: 0 at hip height, ~1.1-1.3 standing. activeWhenBelow true -> active when knee rises.
          // Lighter smoothing (0.4) so a quick knee drive isn't blurred away. Lower band: a knee at hip
          // height reads drop~0 (below target 0.25 = complete); dropping back only needs to exceed exit
          // 0.60 to finish/re-arm, which far more cameras clear than 0.80 (close/partly-cut-off framing
          // sits lower). enter 0.35 still prevents a small bob that never reaches hip height from starting.
          const drop = smoothV('hk_' + side, (knee.y - hipY) / (torsoRef || 1), 0.4);
          runSideRep(hkLegs, side, { metric: drop, activeWhenBelow: true,
            enter: 0.35, exit: 0.60, target: 0.25,
            incompleteMsg: 'Drive your knee up to hip height', formMsg: 'Keep your torso upright',
            formEvaluable: leanEval, formBad: leanBad,
            minActiveFrames: 2, minEvalFrames: 2, badRatio: 0.5, debounceMs: 250, pair: false, maxActiveMs: 4000 });
          dbg[side] = drop.toFixed(2) + '(' + hkLegs[side].stage[0] + ')';
        });
        if (!anyKnee) { setForm('unknown'); debugEl.textContent = 'show your full body'; return; }
        setForm(leanBad ? 'bad' : 'good', 'Keep your torso upright');
        debugEl.textContent = 'HK L:' + dbg.left + ' R:' + dbg.right + ' good:' + count + ' bad:' + badCount;
      },

      // 11. KNEE RAISE — meaningful knee lift relative to body; robust to one-side visibility.
      kneeraise: function (keypoints) {
        const lh = kp(keypoints, 'left_hip'), rh = kp(keypoints, 'right_hip');
        const hips = [lh, rh].filter(Boolean);
        if (!hips.length) { setForm('unknown'); debugEl.textContent = 'show your full body'; return; }
        const hipY = hips.reduce((t, h) => t + h.y, 0) / hips.length;
        const knees = [kp(keypoints, 'left_knee'), kp(keypoints, 'right_knee')].filter(Boolean);
        if (!knees.length) { setForm('unknown'); debugEl.textContent = 'leg not visible'; return; }
        const workingKnee = knees.reduce((a, b) => (a.y <= b.y ? a : b));
        const kneeToHip = workingKnee.y - hipY;
        const raised = kneeToHip < 50 * bodyScale, down = kneeToHip > 95 * bodyScale;
        // FORM: stay upright — leaning the torso back to meet the knee is a cheat (judged only when shoulders visible).
        const ls = kp(keypoints, 'left_shoulder'), rs = kp(keypoints, 'right_shoulder');
        const hipX = hips.reduce((t, h) => t + h.x, 0) / hips.length;
        const leanEval = !!(ls && rs);
        const leanDeg = leanEval ? verticalDeg({ x: (ls.x + rs.x) / 2, y: (ls.y + rs.y) / 2 }, { x: hipX, y: hipY }) : 0;
        const leanBad = leanEval && leanDeg > 28;
        setForm(leanBad ? 'bad' : 'good', 'Keep your torso upright');
        debugEl.textContent = 'KNEE-HIP:' + Math.round(kneeToHip) + ' LEAN:' + Math.round(leanDeg) + ' ' + R.stage + ' good:' + count + ' bad:' + badCount + ' sc:' + bodyScale.toFixed(2);
        if (R.stage === 'active') repFrame(leanEval, leanBad);
        if (R.stage === 'ready' && raised) repStart(() => sayActive('Lower'));
        else if (R.stage === 'active' && down) repFinish({ debounceMs: 300, minActiveFrames: 2, minEvalFrames: 2, badRatio: 0.5, formMsg: 'Keep your torso upright' });
      },

      // 12. SIDE LEG RAISE — lateral abduction of the ankle from the hip, normalized by PIXEL
      // leg length (hip→knee→ankle). Each leg counted INDEPENDENTLY (pair:false) via its own
      // limb machine, so doing all reps on one leg then switching keeps counting. Uses kpL +
      // sideMissing. NOTE: legLen is a PIXEL distance here — mixing it with the metric dist3D()
      // (world metres) made the ratio ~20 and the leg always looked "raised".
      sidelegraise: function (keypoints) {
        let anyVisible = false, fault = '';
        const dbg = { left: '-', right: '-' };
        ['left', 'right'].forEach((side) => {
          const hip = kpL(keypoints, side + '_hip'), knee = kpL(keypoints, side + '_knee'), ankle = kpL(keypoints, side + '_ankle');
          if (!(hip && knee && ankle)) { sideMissing(slrLegs[side]); return; }
          anyVisible = true;
          const legLen = Math.max(Math.hypot(hip.x - knee.x, hip.y - knee.y) + Math.hypot(knee.x - ankle.x, knee.y - ankle.y), 1);
          // Lateral offset of the ankle from the hip, normalized by leg length (0 = straight down).
          const abduction = smoothV('slr_' + side, Math.abs(ankle.x - hip.x) / legLen);
          // FORM: raise from the hip, don't lean the torso over to hike the leg up.
          const shoulder = kpL(keypoints, side + '_shoulder');
          const leanEval = !!shoulder;
          const leanDeg = leanEval ? verticalDeg(shoulder, hip) : 0;
          const leanBad = leanEval && leanDeg > 30;
          if (leanBad) fault = 'Keep your torso upright — raise from the hip';
          runSideRep(slrLegs, side, { metric: abduction, activeWhenBelow: false,
            enter: 0.45, exit: 0.2, target: 0.45,
            incompleteMsg: 'Raise your leg higher', formMsg: 'Keep your torso upright — raise from the hip',
            formEvaluable: leanEval, formBad: leanBad,
            minActiveFrames: 2, minEvalFrames: 3, badRatio: 0.5, debounceMs: 300, pair: false, maxActiveMs: 8000 });
          dbg[side] = abduction.toFixed(2) + '(' + slrLegs[side].stage[0] + ')';
        });
        if (!anyVisible) { setForm('unknown'); debugEl.textContent = 'show hip, knee & ankle'; return; }
        setForm(fault ? 'bad' : 'good', fault || 'Keep your torso upright — raise from the hip');
        debugEl.textContent = 'SLR L:' + dbg.left + ' R:' + dbg.right + ' good:' + count + ' bad:' + badCount;
      },

      // 13. SIDE BEND — torso tilt from shoulder/hip lines, normalized by hip width.
      sidebend: function (keypoints) {
        const ls = kp(keypoints, 'left_shoulder'), rs = kp(keypoints, 'right_shoulder');
        const lh = kp(keypoints, 'left_hip'), rh = kp(keypoints, 'right_hip');
        if (!(ls && rs && lh && rh)) { setForm('unknown'); debugEl.textContent = 'show your upper body'; return; }
        const shoulderTilt = Math.abs(ls.y - rs.y);
        const hipWidth = Math.max(Math.abs(lh.x - rh.x), 1);
        const tilt = smoothV('bend', (shoulderTilt / hipWidth) * 100);
        const bent = tilt > 40, upright = tilt < 20;
        // FORM: side bend is lateral flexion of the SPINE — the pelvis should stay fairly level.
        // A large pelvic tilt means the whole body is hinging/leaning, not bending at the waist.
        const hipTilt = smoothV('bend_hip', (Math.abs(lh.y - rh.y) / hipWidth) * 100);
        const formBad = hipTilt > 35;
        setForm(formBad ? 'bad' : 'good', 'Bend at your waist — keep your hips level');
        debugEl.textContent = 'TILT:' + Math.round(tilt) + ' HIPTILT:' + Math.round(hipTilt) + ' ' + R.stage + ' good:' + count + ' bad:' + badCount;
        if (R.stage === 'active') repFrame(true, formBad, tilt, 'max');
        if (R.stage === 'ready' && bent) repStart(() => sayActive('Back to center'));
        else if (R.stage === 'active' && upright) repFinish({ debounceMs: 300, minActiveFrames: 2, minEvalFrames: 3, badRatio: 0.5, target: 40, track: 'max', incompleteMsg: 'Bend further', formMsg: 'Bend at your waist — keep your hips level' });
      },

      // 14. DEADLIFT — rule-based lifecycle + optional experimental ML augmentation.
      deadlift: deadliftDetector,
    };

    /* -------------------------------------------------------------------------
       DEADLIFT DETECTOR
       Signals: hip-hinge (shoulder-hip-knee), knee angle, ear->shoulder->hip
       neck/head proxy, trunk-vertical lean, hip-vs-chest rise ratio, and an
       EXPERIMENTAL torso-shrink feature. Feedback priority:
       visibility -> torso -> hinge -> hips -> knee -> lockout -> back -> ML.
       ------------------------------------------------------------------------- */
    function deadliftDetector(keypoints) {
      const S = pickSide(keypoints, ['shoulder', 'hip', 'knee', 'ankle']);
      const shoulder = kp(keypoints, S + '_shoulder'), hip = kp(keypoints, S + '_hip');
      const knee = kp(keypoints, S + '_knee'), ankle = kp(keypoints, S + '_ankle');
      // VISIBILITY gate -> UNKNOWN (never fake-bad).
      if (!(shoulder && hip && knee && ankle)) {
        setFormRaw('unknown', 'Body partly hidden');
        dlQuality(keypoints, S, false, { haveBase: dlBaseReady() });
        debugEl.textContent = 'stand side-on — show head to feet';
        return;
      }

      // Measure the MediaPipe frame interval (used for the proxy one-missed-frame tolerance).
      if (dlPrevNow) { const fdt = NOW - dlPrevNow; if (fdt > 0 && fdt < 500) dlFrameDtMs = dlFrameDtMs * 0.7 + fdt * 0.3; }
      dlPrevNow = NOW;

      const backAngle = smoothV('dl_back', ang(shoulder, hip, knee));   // hip angle (shoulder-hip-knee)
      const kneeAngle = smoothV('dl_knee', ang(hip, knee, ankle));
      lastAngle = backAngle;

      // Body-lowering proxy for the conventional deadlift: how far the hip has dropped toward the
      // ankle, normalized by LEG LENGTH so it is body-scale invariant. ~1.0 standing tall; it falls
      // as the hips lower. An RDL keeps the hips high (stays near 1), a conventional deadlift drops them.
      const legLenPx = Math.hypot(hip.x - knee.x, hip.y - knee.y) + Math.hypot(knee.x - ankle.x, knee.y - ankle.y);
      const hipDrop = legLenPx > 1 ? smoothV('dl_hipdrop', (ankle.y - hip.y) / legLenPx, 0.4) : 1;

      // Keep baselines fresh while standing upright between reps (also calibrated during the countdown).
      if (R.stage === 'ready' && backAngle > 165) dlCalibrate(keypoints);
      // Legacy standing torso baseline for the ML feature vector (unchanged).
      const torso3D = dist3D(shoulder, hip);
      if (R.stage === 'ready' && backAngle > 160) dlBaseTorso = dlBaseTorso ? dlBaseTorso * 0.9 + torso3D * 0.1 : torso3D;

      // Head point with fallbacks: near ear -> far ear -> nose.  (fix #3: ear dropout)
      const head = bestHead(keypoints, S);
      const headSrc = head ? head.src : null;
      const earAngle = head ? smoothV('dl_ear', ang(head.pt, shoulder, hip), BACK_EMA_ALPHA) : null;

      // Trunk-shortening signal vs standing baseline (fix #2). ~1.0 on a pure hinge; drops on rounding.
      const shrink = (dlBaseReady() && dlBase.shoulderHip) ? smoothV('dl_shrink', torso3D / dlBase.shoulderHip, BACK_EMA_ALPHA) : 1;

      const leanDeg = verticalDeg(shoulder, hip);
      // Shin lean from vertical (knee->ankle). A deadlift keeps the shins near vertical while the torso
      // leans far forward; a squat leans torso and shins together. torsoShinSep is the gap that tells
      // them apart even when a squat leans forward a lot (see minTorsoShinSep).
      const shinDeg = verticalDeg(knee, ankle);
      const torsoShinSep = leanDeg - shinDeg;
      const front = frontFacingRatio(keypoints);
      const frontFacing = front > FRONT_FACING_MAX;

      // Can we judge the back? Need calibration + a head point + a side-ish camera.
      const haveBase = dlBaseReady(), haveHead = !!head;
      const canJudge = haveBase && haveHead && !frontFacing;

      // Signal A: ear/head-shoulder-hip angle DROP vs the user's OWN baseline FOR THE SAME head source
      // (fix: per-head-source baseline). Only when that source has been calibrated.
      const earBaseOk = headBaseReady(headSrc);
      const earDelta = (canJudge && earBaseOk && earAngle != null) ? (dlBase.ear[headSrc].v - earAngle) : 0;
      const flagEar = canJudge && earBaseOk && earDelta > BACK_ROUND_DEV;
      // Signal B: trunk shortening.
      const flagShrink = haveBase && shrink < BACK_SHRINK_MIN;
      const suspectNow = canJudge ? (flagEar || flagShrink) : false;
      const bothAgree = flagEar && flagShrink;                 // higher confidence when both agree

      // Primary rounding signal: the ear/shrink proxy.
      const roundSuspect = suspectNow;
      const persistMs = BACK_PERSIST_MS;

      // Hip-vs-chest rise ratio (heuristic) — SMOOTHED (fix): the raw per-frame ratio is spiky, so EMA
      // it before using/aggregating, otherwise one noisy frame inflates hipRiseMax.
      let hipRiseRaw = 0;
      if (dlPrevHipY !== null && dlPrevShoulderY !== null) {
        const dHip = dlPrevHipY - hip.y, dSh = dlPrevShoulderY - shoulder.y;
        // NOISE FLOOR scaled to the body: ignore sub-noise movement AND never divide by a tiny number.
        // With a 0.5 px floor, landmark jitter manufactured huge ratios and produced false
        // "hips rising faster than the chest" flags (caught by the jitter test).
        const torsoRef = torsoPx > 0 ? torsoPx : Math.hypot(shoulder.x - hip.x, shoulder.y - hip.y);
        const floor = Math.max(1.5, 0.03 * Math.max(torsoRef, 60));
        if (dHip > floor) hipRiseRaw = dHip / Math.max(Math.abs(dSh), floor);
      }
      dlPrevHipY = hip.y; dlPrevShoulderY = shoulder.y;
      const hipRiseInstant = smoothV('dl_hiprise', hipRiseRaw, 0.4);

      // Lean-back at lockout — DIRECTION-AGNOSTIC (fix #6): trunk tilts AWAY from the calibrated facing side.
      const trulyLockedOut = backAngle > DLC.lockoutBack;
      const leaningBack = dlBase.facingSign ? (Math.sign(shoulder.x - hip.x) === -dlBase.facingSign) : false;
      const leanBackNow = trulyLockedOut && leaningBack && leanDeg > LEAN_BACK_DEG;

      // Short live persistence (fix #4). A rounding run tolerates ONE missed frame — a flickering
      // signal from a genuinely rounded back must still accumulate.
      const gapTolMs = ROUND_GAP_PROXY * dlFrameDtMs;
      if (roundSuspect) { if (!dlRoundSince) dlRoundSince = NOW; dlRoundLast = NOW; }
      else if (dlRoundSince && (NOW - dlRoundLast) <= gapTolMs) { /* tolerate one gap */ }
      else dlRoundSince = 0;
      const backBadLive = dlRoundSince && (NOW - dlRoundSince >= persistMs);
      // HIGH-CONFIDENCE rounding: BOTH proxies agree, sustained (same one-gap tolerance). This is the
      // one that turns the border RED and fails the rep; the single-signal backBadLive stays advisory.
      if (bothAgree) { if (!dlBothSince) dlBothSince = NOW; dlBothLast = NOW; }
      else if (dlBothSince && (NOW - dlBothLast) <= gapTolMs) { /* tolerate one gap */ }
      else dlBothSince = 0;
      const bothBadLive = canJudge && dlBothSince && (NOW - dlBothSince >= BACK_BOTH_MS);
      if (leanBackNow) { if (!dlLeanSince) dlLeanSince = NOW; } else dlLeanSince = 0;
      const leanBadLive = leanBackNow && dlLeanSince && (NOW - dlLeanSince >= LEAN_BACK_MS);

      // ---- RAW per-frame form state (commit layer smooths it into border/message) ----
      // Poor angle / unseen head / not-yet-calibrated = AMBER with a reason (never fake green/red).
      // HIGH-CONFIDENCE rounding (both proxies agree + sustained) = RED and fails the rep. A SINGLE
      // proxy (ear-angle OR shrink alone) or lean-back is only ADVISORY (green + a coaching note),
      // because one signal false-fires when you just look down — MediaPipe has no true spine point.
      if (!canJudge) {
        const why = frontFacing ? 'Turn side-on to the camera'
                  : !haveHead  ? 'Head not visible'
                  : !haveBase  ? 'Stand tall to calibrate'
                  : 'Position unclear';
        setFormRaw('unknown', why);
      } else if (bothBadLive) {
        setForm('bad', 'Back rounding — keep your chest up and back flat');   // high-confidence -> RED
      } else if (backBadLive) {
        setFormRaw('good', 'Keep your chest up and back flat');   // single proxy -> advisory only
      } else if (leanBadLive) {
        setFormRaw('good', 'Avoid leaning back at the top');      // advisory, not a red fault
      } else {
        setFormRaw('good', 'Good form - straight back');
      }

      // ---- aggregate while active (drives the rep-level decision) ----
      if (R.stage === 'active' && dlAgg) {
        dlAgg.frames++;
        // Capture the torso-vs-shin separation AT the deepest hinge (new backMin) — the bottom of the
        // movement, where squat and deadlift differ most. Checked BEFORE backMin is updated below.
        if (backAngle < dlAgg.backMin) dlAgg.sepAtDeepest = torsoShinSep;
        dlAgg.backMin = Math.min(dlAgg.backMin, backAngle); dlAgg.backMax = Math.max(dlAgg.backMax, backAngle);
        dlAgg.kneeMin = Math.min(dlAgg.kneeMin, kneeAngle); dlAgg.kneeMax = Math.max(dlAgg.kneeMax, kneeAngle);
        if (earAngle !== null) dlAgg.earMin = Math.min(dlAgg.earMin, earAngle);
        dlAgg.leanMax = Math.max(dlAgg.leanMax, leanDeg);
        dlAgg.hipDropMin = Math.min(dlAgg.hipDropMin, hipDrop);
        dlAgg.hipRiseMax = Math.max(dlAgg.hipRiseMax, hipRiseInstant);
        dlAgg.shrinkMin = Math.min(dlAgg.shrinkMin, shrink);
        dlAgg.frontSum += front; dlAgg.frontN++;
        if (canJudge) dlAgg.backEvalFrames++;
        if (canJudge && earBaseOk) dlAgg.earDeltaMax = Math.max(dlAgg.earDeltaMax, earDelta);
        dlLastPeak = { dEAR: dlAgg.earDeltaMax, shr: dlAgg.shrinkMin };  // live + persists after the rep
        if (bothAgree) dlAgg.bothAgree = true;
        // Longest sustained rounding RUN (ms) during the pull — tolerates one missed frame. Any
        // long-enough run fails the rep.
        if (roundSuspect) { if (!dlAgg.runStart) dlAgg.runStart = NOW; dlAgg.runLast = NOW; dlAgg.runMax = Math.max(dlAgg.runMax, NOW - dlAgg.runStart); }
        else if (dlAgg.runStart && (NOW - dlAgg.runLast) <= gapTolMs) { /* tolerate one gap */ }
        else dlAgg.runStart = 0;
        // HIGH-CONFIDENCE rounding run (BOTH proxies agree) — this is what fails the rep.
        if (bothAgree) { if (!dlAgg.bothRunStart) dlAgg.bothRunStart = NOW; dlAgg.bothRunLast = NOW; dlAgg.bothRunMax = Math.max(dlAgg.bothRunMax, NOW - dlAgg.bothRunStart); }
        else if (dlAgg.bothRunStart && (NOW - dlAgg.bothRunLast) <= gapTolMs) { /* tolerate one gap */ }
        else dlAgg.bothRunStart = 0;
        if (leanBadLive) dlAgg.leanBackMs = Math.max(dlAgg.leanBackMs, NOW - dlLeanSince);
        // Recorder (dev): only record judgeable frames, with a canJudge column.
        if (DL_REC_FRAME && canJudge) {
          dlRecordFrame([earDelta, shrink, leanDeg, backAngle, kneeAngle, front], DL_LABEL, true);
        }
        // Posture proxies are advisory (don't reject reps), so no bad-form evidence is fed here.
        repFrame(canJudge, false, backAngle, 'min');
      }

      dlQuality(keypoints, S, canJudge, { frontFacing, haveHead, haveBase });

      debugEl.textContent =
        'BACK:' + Math.round(backAngle) + ' KNEE:' + Math.round(kneeAngle) +
        ' SEP:' + Math.round(torsoShinSep) + '/' + DLC.minTorsoShinSep +
        ' dEAR:' + (canJudge ? Math.round(earDelta) : '-') + ' SHR:' + shrink.toFixed(2) +
        ' ' + R.stage + (canJudge ? '' : ' [amber]') +
        ('\nPEAK dEAR:' + Math.round(dlLastPeak.dEAR) + '/' + BACK_ROUND_DEV + ' SHRmin:' + dlLastPeak.shr.toFixed(2) + '/' + BACK_SHRINK_MIN) +
        '\ngood:' + count + ' bad:' + badCount + ' side:' + S +
        ' base:' + (haveBase ? 'ok' : dlBase.n + '/' + CALIB_MIN_FRAMES) + ' mode:' + DLMODE + '/' + DLVAR;

      // State transitions.
      // ARM the next rep only once the user has returned to a tall stand — this stops random bending /
      // flailing from counting rep after rep (you must actually stand up straight between reps).
      if (R.stage === 'ready' && backAngle > STAND_TALL_BACK && kneeAngle > STAND_TALL_KNEE) dlArmed = true;
      const entering = backAngle < DLC.enterBack;
      const exiting = backAngle > DLC.exitBack;
      if (R.stage === 'ready' && entering && dlArmed) { repStart(() => sayActive('Drive up!')); dlResetAgg(); dlArmed = false; }
      else if (R.stage === 'active' && exiting) { finishDeadliftRep(); }
    }

    // Front-facing heuristic: shoulder width / torso length. Larger = more front-on.
    // Used mainly as a SETUP aid (warn when clearly front-facing); 45° is fine.
    function frontFacingRatio(keypoints) {
      const ls = kpRaw(keypoints, 'left_shoulder'), rs = kpRaw(keypoints, 'right_shoulder');
      if (!ls || !rs || !torsoPx) return 0.7;
      return Math.abs(ls.x - rs.x) / Math.max(torsoPx, 1);
    }

    // Tracking-quality chip: explains WHY accuracy dropped (never blocks counting).
    const SETUP_TIP = 'Setup: phone at hip height, 2–3 m away, side-on, head to feet in frame.';
    function dlQuality(keypoints, S, canJudge, flags) {
      if (MINIMAL_UI) { dlQualityReasons = []; if (qualityChip) qualityChip.style.display = 'none'; return; } // chip hidden
      flags = flags || {};
      const reasons = [];
      if (flags.frontFacing) reasons.push('Front-facing — turn side-on');
      if (flags.haveHead === false) reasons.push('Head not visible');
      if (keypoints && (!jointVisible(keypoints, 'hip') || !jointVisible(keypoints, 'shoulder'))) reasons.push('Body partly hidden');
      if (keypoints && !jointVisible(keypoints, 'ankle')) reasons.push('Feet cut off');
      if (torsoPx && torsoPx < TOO_FAR_TORSO_PX) reasons.push('Too far — move closer');
      if (curFps && curFps < LOW_FPS) reasons.push('Low frame rate');
      if (NOW - lastSideSwitchMs < 1500) reasons.push('Tracking switched sides');
      if (flags.haveBase === false) reasons.push('Calibrating — stand tall');
      dlQualityReasons = reasons;
      if (!qualityChip) return;
      if (reasons.length) {
        qualityChip.style.display = 'block';
        qualityChip.textContent = '⚠ ' + reasons[0] + (reasons.length > 1 ? ' (+' + (reasons.length - 1) + ')' : '') + '  ⓘ';
      } else {
        qualityChip.style.display = 'none';
        if (setupHint) setupHint.style.display = 'none';
      }
    }
    function hideQuality() { if (qualityChip) qualityChip.style.display = 'none'; if (setupHint) setupHint.style.display = 'none'; }
    // Tapping the chip reveals/hides the detailed reasons + setup tip.
    if (qualityChip) qualityChip.addEventListener('click', () => {
      if (!setupHint) return;
      const show = setupHint.style.display !== 'block';
      setupHint.style.display = show ? 'block' : 'none';
      setupHint.textContent = (dlQualityReasons.length ? ('Tracking: ' + dlQualityReasons.join(' · ') + '.  ') : '') + SETUP_TIP;
    });

    function finishDeadliftRep() {
      R.stage = 'ready'; R.readySinceMs = NOW;
      if (!dlAgg || dlAgg.frames < 3) { dlAgg = null; return; }    // too short / noise
      const a = dlAgg;
      // NOT A REAL ATTEMPT: the user barely moved — no hip hinge AND no knee bend -> ignore entirely
      // (no good, no bad, no debounce consumed). Stops idle/partial bobbing from counting. A genuine
      // attempt that falls short of conventional depth is NOT ignored here — it is rejected below with
      // corrective feedback (e.g. an RDL-depth pull -> "Bend your knees more and lower your body").
      const anyHinge = a.backMin <= 145, anyKnee = a.kneeMin <= 150;
      if (!anyHinge && !anyKnee) { dlAgg = null; return; }
      if (NOW - R.lastRepMs < 400) { dlAgg = null; return; }      // deadlift debounce
      R.lastRepMs = NOW;

      const frontMean = a.frontN ? a.frontSum / a.frontN : 0.7;
      // Feature vector (fixed order). Defaults keep numbers finite when a signal is absent.
      const f = [
        a.backMin === 999 ? 170 : a.backMin,                     // deepest hinge
        (a.backMax === -999 ? 170 : a.backMax) - (a.backMin === 999 ? 170 : a.backMin), // back range
        a.kneeMin === 999 ? 170 : a.kneeMin,                     // deepest knee bend
        (a.kneeMax === -999 ? 170 : a.kneeMax) - (a.kneeMin === 999 ? 170 : a.kneeMin), // knee range
        a.earMin === 999 ? 150 : a.earMin,                       // neck/head proxy
        a.leanMax,                                               // max trunk lean
        a.hipRiseMax,                                            // hip-vs-chest rise ratio
        a.shrinkMin,                                             // EXPERIMENTAL torso shrink
        frontMean,                                               // orientation
      ];

      // UNVERIFIED: too little of the rep was judgeable -> not counted, not bad, amber flash.
      // (We do NOT record unverified reps — only clean, judgeable reps become training data.)
      const coverage = a.frames ? a.backEvalFrames / a.frames : 0;
      if (coverage < MIN_EVAL_COVERAGE && !UNVERIFIED_REP_COUNTS) {
        dlAgg = null;
        repUnverified('Could not verify this rep — position unclear');
        return;
      }

      // Recording mode (dev): store this rep's features + label for training data.
      if (DL_RECORD) dlRecord(f, DL_LABEL);

      // ---- STRICT CONVENTIONAL-DEADLIFT ACCEPTANCE ----
      // A rep COUNTS only when the MOVEMENT is a valid conventional deadlift AND the back wasn't
      // clearly rounded. Everything here is judged from the SPINE LINE (shoulder->hip torso axis) and
      // the leg joints — reliable landmarks. Rejections:
      //   (movement) squat / knee / hip / torso / depth / lockout / HIPS-SHOOT-UP-FIRST
      //   (back) HIGH-CONFIDENCE rounding — BOTH proxies (ear-angle AND torso-shortening) agreed and
      //          stayed bad for BACK_BOTH_MS. A single proxy alone or lean-back is advisory only
      //          (coaching tip, still counts), because one signal false-fires on a normal head-down
      //          pull — MediaPipe has no true mid-spine landmark, so rounding can't be measured directly.
      const reasons = [];   // faults that REJECT the rep

      // Conventional-bottom conditions (evaluated together), all from reliable landmarks:
      const hipHinged   = a.backMin <= DLC.hipBottomMax;                 // hip clearly flexed
      const kneeBent    = DLC.kneeMode === 'bend'     ? a.kneeMin <= DLC.kneeBottomMax : true;   // conventional: knees flex
      const kneeOkRdl   = DLC.kneeMode === 'straight' ? a.kneeMin >= (DLC.kneeTooBent || 0) : true; // RDL: knees stay straight
      const torsoInclined = a.leanMax >= DLC.torsoLeanMin;               // forward trunk (vs squat)
      const bodyLowered = a.hipDropMin <= DLC.hipDropMax;                // hips actually dropped (vs RDL high hips)
      const lockoutReached = a.backMax >= DLC.lockoutBack && (DLC.lockoutKnee === 0 || a.kneeMax >= DLC.lockoutKnee);
      // Squat tell: knees bent deep AND the movement looked like a squat, which is EITHER
      //   (a) the torso stayed too upright (leanMax below squatLeanMax), OR
      //   (b) the torso and shins leaned TOGETHER — torso-minus-shin separation at the bottom stayed
      //       below minTorsoShinSep. (b) catches a deep, forward-leaning squat that clears the lean gate
      //       on torso angle alone; a real deadlift pushes the hips back so the torso leans far more than
      //       the near-vertical shins.
      const looksSquat  = DLC.kneeMode === 'bend' && a.kneeMin <= DLC.kneeBottomMax &&
                          (a.leanMax < DLC.squatLeanMax || a.sepAtDeepest < DLC.minTorsoShinSep);
      // Hips shoot up first (stiff-legging it into a good-morning) — a real conventional-deadlift fault.
      const hipsShootUp = a.hipRiseMax >= HIP_SHOOT_FAIL;
      // HIGH-CONFIDENCE back rounding: BOTH proxies agreed and sustained (see BACK_BOTH_MS).
      const backRounded = coverage >= MIN_EVAL_COVERAGE && a.bothRunMax >= BACK_BOTH_MS;

      // Fault priority: rounding -> squat -> knee -> hip -> torso -> depth -> lockout -> hips-shoot.
      if (backRounded) reasons.push('Back rounding — keep your chest up and back flat');
      else if (looksSquat) reasons.push("Don't turn the movement into a squat");
      else if (!kneeBent) reasons.push('Bend your knees more and lower your body');   // RDL-like: knees didn't flex
      else if (!kneeOkRdl) reasons.push('Keep your legs mostly straight');            // RDL variant: knees too bent
      else if (!hipHinged) reasons.push('Hinge more at your hips');
      else if (!torsoInclined) reasons.push('Hinge at your hips, lean your chest forward');
      else if (!bodyLowered) reasons.push('Lower further into the deadlift position');
      else if (!lockoutReached) reasons.push('Stand fully upright to complete the rep');
      else if (hipsShootUp) reasons.push('Keep your hips and chest rising together');

      // Remaining non-blocking coaching tips (counted reps still get advice): a SINGLE rounding proxy
      // (not high-confidence) or a lean-back at the top.
      const singleRound = coverage >= MIN_EVAL_COVERAGE && a.runMax >= BACK_RUN_MS && !backRounded;
      const tip = singleRound ? 'Keep your chest up and back flat'
                : a.leanBackMs >= LEAN_BACK_MS ? 'Avoid leaning back at the top'
                : '';

      let rulesBad = reasons.length > 0;

      // ---- ML augmentation (only when allowed by mode + validation gate) ----
      let mlBad = false;
      if (mlAllowedNow()) {
        const pGood = dlPredictGood(f);
        if (pGood !== null && pGood < 0.4) { mlBad = true; reasons.push('Adjust your form'); }
      }

      const bad = rulesBad || mlBad || (STRICT_RED_FAILS_REP && committedState === 'bad');  // optional flag (default off)
      dlAgg = null;
      if (bad) badRep(reasons[0] || 'Fix your form');
      else {
        rep();                                             // movement is a valid deadlift -> COUNT
        if (tip) send({ type: 'form', good: true, state: 'good', msg: tip });  // non-blocking coaching
      }
    }

    /* =========================================================================
       READINESS + READINESS-AWARE COUNTDOWN (replaces the blind 5s timer)
       ========================================================================= */
    const REQUIRED = {
      squat: ['hip', 'knee', 'ankle'], sumosquat: ['hip', 'knee', 'ankle'],
      bicepcurl: ['shoulder', 'elbow', 'wrist'], tricepextension: ['shoulder', 'elbow', 'wrist'],
      shoulderpress: ['shoulder', 'elbow', 'wrist'], lateralraise: ['shoulder', 'wrist', 'hip'],
      frontraise: ['shoulder', 'wrist', 'hip'], pushup: ['shoulder', 'elbow', 'wrist', 'hip', 'knee', 'ankle'],
      jumpingjack: ['shoulder', 'wrist', 'hip', 'ankle'], highknees: ['hip', 'knee'],
      kneeraise: ['hip', 'knee'], sidelegraise: ['hip', 'knee', 'ankle'], sidebend: ['shoulder', 'hip'],
      deadlift: ['shoulder', 'hip', 'knee', 'ankle'],
    };

    function readiness(keypoints) {
      if (!keypoints) return { ok: false, msg: 'Step into frame' };
      const need = REQUIRED[exercise] || ['shoulder', 'hip'];
      for (const j of need) {
        if (!jointVisible(keypoints, j)) return { ok: false, msg: 'Show your ' + j + 's clearly' };
      }
      if (exercise === 'deadlift') {
        // Full body: head + ankles visible.
        const headOk = jointVisible(keypoints, 'ear') || (kpRaw(keypoints, 'nose') && kpRaw(keypoints, 'nose').score >= 0.5);
        if (!headOk) return { ok: false, msg: 'Show your head too' };
        if (!jointVisible(keypoints, 'ankle')) return { ok: false, msg: 'Show your whole body (feet included)' };
        // Orientation: warn only when CLEARLY front-facing; 45° / side is fine.
        const fr = frontFacingRatio(keypoints);
        if (fr > 1.1) return { ok: false, msg: 'Turn slightly sideways' };
      }
      return { ok: true, msg: 'Hold still…' };
    }

    let started = false;
    let readyStableSince = 0;
    let countdownActive = false, countdownStartMs = 0;
    const COUNTDOWN_SEC = 5;
    const countdownOverlay = document.getElementById('countdownOverlay');
    const cdRing = document.getElementById('countdownRing');
    const cdNumber = document.getElementById('countdownNumber');
    const cdLabel = document.getElementById('countdownLabel');

    function cancelCountdown() {
      if (!countdownActive) return;
      countdownActive = false;
      countdownOverlay.style.display = 'none';
    }
    function beginCountdown() {
      countdownActive = true; countdownStartMs = NOW;
      countdownOverlay.style.display = 'flex';
      send({ type: 'countdown', seconds: COUNTDOWN_SEC, total: COUNTDOWN_SEC });
    }
    function updateCountdown() {
      const elapsed = (NOW - countdownStartMs) / 1000;
      const remaining = Math.ceil(COUNTDOWN_SEC - elapsed);
      if (remaining > 0) {
        if (cdNumber.textContent !== String(remaining)) {
          cdNumber.textContent = remaining;
          cdNumber.classList.remove('pulse'); void cdNumber.offsetWidth; cdNumber.classList.add('pulse');
          send({ type: 'countdown', seconds: remaining, total: COUNTDOWN_SEC });
        }
        cdRing.style.setProperty('--progress', Math.round((Math.max(0, COUNTDOWN_SEC - elapsed) / COUNTDOWN_SEC) * 360) + 'deg');
        cdLabel.textContent = '';
      } else {
        cdRing.style.setProperty('--progress', '0deg');
        cdNumber.textContent = 'GO!'; cdLabel.textContent = '';
        send({ type: 'countdown', seconds: 0, total: COUNTDOWN_SEC });
        countdownActive = false;
        started = true;
        R.stage = 'ready'; R.readySinceMs = NOW;
        setTimeout(() => { countdownOverlay.style.display = 'none'; }, 400);
        send({ type: 'ar_started' });
        sayActive('Go!');
      }
    }

    function updateStartup(keypoints) {
      const r = readiness(keypoints);
      // Personal calibration (fix #5): capture standing baselines during the countdown.
      if (keypoints && exercise === 'deadlift' && r.ok) dlCalibrate(keypoints);
      if (!r.ok) {
        cancelCountdown();
        readyStableSince = 0;
        statusEl.textContent = r.msg;
        statusEl.style.color = '#FFD700';
        return;
      }
      if (!readyStableSince) readyStableSince = NOW;
      if (NOW - readyStableSince < 700) {   // require brief stability before counting down
        statusEl.textContent = 'Hold position…';
        statusEl.style.color = '#5DCAA5';
        return;
      }
      if (!countdownActive) beginCountdown();
      else updateCountdown();
    }

    /* =========================================================================
       DETECTION LOOP
       ========================================================================= */
    let lastVideoTime = -1, lastSeenMs = 0;

    function detectOnce() {
      if (video.currentTime === lastVideoTime) return;
      lastVideoTime = video.currentTime;
      NOW = performance.now();
      const res = detector.detectForVideo(video, NOW);
      frameCount++;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (res.landmarks && res.landmarks.length > 0) {
        const world = res.worldLandmarks && res.worldLandmarks[0];
        const keypoints = toKeypoints(res.landmarks[0], world, video.videoWidth, video.videoHeight);
        updateBodyScale(keypoints);
        lastSeenMs = NOW;

        if (!started) {
          // Startup/countdown: AMBER with a slow pulse (so the user sees the app is waiting, not frozen).
          updateStartup(keypoints);
          resetFormCommit();
          applyBorder('unknown');
          formBorder.classList.add('amber-pulse');
        } else {
          formBorder.classList.remove('amber-pulse');
          // Rest/idle reset: after a long pause in READY, clear temporary bad-form state.
          if (R.stage === 'ready' && R.readySinceMs && NOW - R.readySinceMs > REST_RESET_MS) {
            R.badFrames = 0; R.evalFrames = 0; R.repValid = true; R.readySinceMs = NOW;
          }
          const detect = EXERCISES[exercise];
          if (detect) detect(keypoints);
          else { setForm('unknown'); debugEl.textContent = 'Unknown exercise: ' + exercise; }
          commitForm();                 // raw -> temporally-confirmed committed state (hysteresis + RED latch)
          sendFormIfChanged();          // message agrees with the committed state
          applyBorder(committedState);  // GREEN / RED / AMBER (verdict flash may briefly override)
        }

        drawSkeleton(keypoints);
      } else {
        // No person this frame.
        if (started) {
          const gap = exercise === 'deadlift' ? POSE_GAP_DL_MS : POSE_GAP_MS;
          if (lastSeenMs && NOW - lastSeenMs > gap) {
            // Brief loss: abandon any incomplete rep (no count, no fake bad rep).
            if (R.stage === 'active') { R.stage = 'ready'; R.extreme = null; R.readySinceMs = NOW; dlAgg = null; }
            // Independent per-side engines (tricep / side-leg / high-knees) too.
            abandonSideRep(triArms.left); abandonSideRep(triArms.right);
            abandonSideRep(slrLegs.left); abandonSideRep(slrLegs.right);
            abandonSideRep(hkLegs.left); abandonSideRep(hkLegs.right);
            // Flush any arm still waiting for a partner so a lone final rep isn't stranded.
            flushPending(triArms); flushPending(latArms); flushPending(curlArms); flushPending(fraiseArms);
          }
          // Pose lost = UNKNOWN (amber), NOT bad form.
          formBorder.classList.remove('amber-pulse');
          setFormRaw('unknown', 'Step back into frame');
          commitForm();
          sendFormIfChanged();
          applyBorder(committedState);
          if (exercise === 'deadlift') dlQuality(null, 'left', false, { haveBase: dlBaseReady() });
          debugEl.textContent = 'no person — step back into frame';
        } else {
          updateStartup(null);
          resetFormCommit();
          applyBorder('unknown');
          formBorder.classList.add('amber-pulse');
          hideQuality();
        }
      }
    }

    function drawSkeleton(keypoints) {
      const drawKeypoints = keypoints.map(smoothKp);
      const color = SKELETON_COLOR;
      ctx.strokeStyle = color; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.shadowColor = color; ctx.shadowBlur = 6;
      CONNECTIONS.forEach(([a, b]) => {
        const p1 = kp(drawKeypoints, a), p2 = kp(drawKeypoints, b);
        if (p1 && p2 && p1.score > MIN_SCORE && p2.score > MIN_SCORE) {
          ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
        }
      });
      drawKeypoints.forEach(k => {
        if (k.score > MIN_SCORE) {
          ctx.fillStyle = color; ctx.beginPath(); ctx.arc(k.x, k.y, 10, 0, 2 * Math.PI); ctx.fill();
          ctx.shadowBlur = 0; ctx.fillStyle = '#FFFFFF';
          ctx.beginPath(); ctx.arc(k.x, k.y, 4, 0, 2 * Math.PI); ctx.fill();
        }
      });
      ctx.shadowBlur = 0;
    }

    let running = false;
    function loop() {
      if (detector && video.readyState === 4 && !running) {
        running = true;
        try { detectOnce(); } catch (e) { debugEl.textContent = 'detect err: ' + e.message; }
        running = false;
      }
      requestAnimationFrame(loop);
    }

    /* =========================================================================
       REPLAY / TEST HOOKS (do not interfere with live camera execution)
       ========================================================================= */
    // Replay one frame. Optional timestamp `ts` lets a replay drive the clock (for deterministic tests);
    // it also runs the commit layer so the committed border/message reflect the replay.
    window.__feed = (kps, ts) => {
      NOW = (ts != null) ? ts : performance.now();
      const f = EXERCISES[exercise]; const r = f ? f(kps) : null;
      commitForm();
      return r;
    };
    window.__count = () => count;
    window.__bad = () => badCount;
    window.__form = () => ({ raw: formState, state: committedState, msg: committedMsg }); // committed border/message
    window.__border = () => ({ verdict: (NOW < verdictUntil ? verdictKind : null), committed: committedState }); // rep-verdict flash state

    // Deadlift ML control hooks (for RN / console / evaluation tooling):
    window.__dlTrain = () => trainDeadlift();
    window.__dlRows = () => dlRows.length;
    window.__dlExport = () => JSON.stringify(dlRows);
    window.__dlClear = () => { dlRows = []; try { localStorage.removeItem(DL_ROWS_KEY); } catch (e) {} return 0; };
    // Per-FRAME back-posture recorder hooks (label mode: open with ?dlrecframe=1&dllabel=good|bad&person=pN):
    window.__dlFrameRows = () => dlFrameRows.length;
    window.__dlFrameExport = () => JSON.stringify(dlFrameRows);
    window.__dlFrameClear = () => { dlFrameRows = []; try { localStorage.removeItem(DL_FRAME_KEY); } catch (e) {} return 0; };
    // Flip validated ONLY after a real evaluation supports it (gates ML in hybrid mode).
    window.__dlValidate = (v) => {
      if (!dlModel) return null;
      dlModel.meta.validated = !!v;
      try { localStorage.setItem(DL_MODEL_KEY, JSON.stringify(dlModel)); } catch (e) {}
      send({ type: 'dl_model', meta: dlModel.meta });
      return dlModel.meta;
    };
    window.__dlModel = () => (dlModel ? dlModel.meta : null);

    /* =========================================================================
       DEADLIFT SELF-TEST — replays synthetic keypoint sequences and checks the
       acceptance criteria. Snapshots & restores live state so it won't pollute a
       real session. Run from the console / RN:  window.__dlSelfTest()
       ========================================================================= */
    function __snap() {
      return {
        count, badCount, unverifiedCount, R: { ...R }, dlAgg: dlAgg ? JSON.parse(JSON.stringify(dlAgg)) : null, dlBase: JSON.parse(JSON.stringify(dlBase)),
        ema: { ...ema }, dlRoundSince, dlRoundLast, dlLeanSince, dlArmed, dlActiveStart, dlPrevHipY, dlPrevShoulderY, dlBaseTorso,
        formState, formMsg, committedState, committedMsg, rawRun, rawRunSince, redUntil,
        verdictUntil, verdictKind, lastSideSwitchMs, activeSide, started, NOW,
      };
    }
    function __restore(s) {
      count = s.count; badCount = s.badCount; unverifiedCount = s.unverifiedCount; Object.assign(R, s.R); dlAgg = s.dlAgg;
      verdictUntil = s.verdictUntil; verdictKind = s.verdictKind;
      dlBase = s.dlBase; Object.keys(ema).forEach(k => delete ema[k]); Object.assign(ema, s.ema);
      dlRoundSince = s.dlRoundSince; dlRoundLast = s.dlRoundLast; dlLeanSince = s.dlLeanSince; dlArmed = s.dlArmed; dlActiveStart = s.dlActiveStart;
      dlPrevHipY = s.dlPrevHipY; dlPrevShoulderY = s.dlPrevShoulderY;
      dlBaseTorso = s.dlBaseTorso; formState = s.formState; formMsg = s.formMsg;
      committedState = s.committedState; committedMsg = s.committedMsg; rawRun = s.rawRun; rawRunSince = s.rawRunSince;
      redUntil = s.redUntil; lastSideSwitchMs = s.lastSideSwitchMs; activeSide = s.activeSide; started = s.started; NOW = s.NOW;
    }
    // Seeded PRNG so the jitter test is deterministic (Math.random made it flaky).
    let __seed = 12345;
    function __rnd() { __seed = (__seed * 1103515245 + 12345) & 0x7fffffff; return __seed / 0x7fffffff; }
    function __resetState() {
      count = 0; badCount = 0; unverifiedCount = 0; verdictUntil = 0; verdictKind = null;
      __seed = 12345; dlFrameDtMs = 50; dlPrevNow = 0;
      Object.assign(R, { stage: 'ready', lastRepMs: 0, readySinceMs: 0, extreme: null, activeFrames: 0, evalFrames: 0, badFrames: 0, repValid: true });
      dlAgg = null; dlBase = { shoulderHip: 0, facingSign: 0, n: 0, ear: { ear: { v: 0, n: 0 }, ear2: { v: 0, n: 0 }, nose: { v: 0, n: 0 } } };
      Object.keys(ema).forEach(k => delete ema[k]);
      dlRoundSince = 0; dlRoundLast = 0; dlBothSince = 0; dlBothLast = 0; dlLeanSince = 0; dlArmed = false; dlActiveStart = 0; dlPrevHipY = null; dlPrevShoulderY = null; dlBaseTorso = 0;
      dlLastPeak = { dEAR: 0, shr: 1 };
      resetFormCommit(); started = true;
    }
    // Synthetic side-on deadlift pose. backFromVert: 5=standing, ~80=deep hinge. round: 0..1 rounding.
    function __dlPose(o) {
      o = o || {};
      const backFromVert = o.backFromVert != null ? o.backFromVert : 5;
      const round = o.round || 0, headVis = o.headVis != null ? o.headVis : 1, face = o.face != null ? o.face : 1;
      const earVis = o.earVis != null ? o.earVis : headVis;      // 2b.6(g): ear/nose visibility separately
      const noseVis = o.noseVis != null ? o.noseVis : headVis;
      const jit = o.jitter || 0;                                  // 2b.6(f): landmark jitter
      const J = () => (jit ? (__rnd() - 0.5) * 2 * jit : 0);      // SEEDED -> the test is reproducible
      const kneeBend = o.kneeBend != null ? o.kneeBend : (backFromVert > 40 ? 40 : 5);
      const hip = { x: 200, y: 300 };
      const br = backFromVert * Math.PI / 180, Ls = 120 * (1 - 0.12 * round);
      const shoulder = { x: hip.x + face * Math.sin(br) * Ls, y: hip.y - Math.cos(br) * Ls };
