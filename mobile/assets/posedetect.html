      // Faithful 2-segment leg: the knee bend (knee angle = 180 - kneeBend) is SPLIT between a thigh
      // incline (th, knee forward of hip) and a shin incline (s, from vertical). A DEADLIFT keeps the
      // shin near-vertical (small s) and inclines the thigh (hips back/high); a SQUAT inclines the shin
      // (knees forward) — pass shinFromVert to model it. Default s is small (deadlift-like). Knee angle
      // = 180 - (th + s) = 180 - kneeBend, so every existing case keeps its knee angle.
      const s = o.shinFromVert != null ? o.shinFromVert : Math.min(kneeBend, 12);
      const th = Math.max(0, kneeBend - s);
      const tr = th * Math.PI / 180, sr = s * Math.PI / 180;
      const knee = { x: hip.x + face * Math.sin(tr) * 120, y: hip.y + Math.cos(tr) * 120 };
      const ankle = { x: knee.x - face * Math.sin(sr) * 120, y: knee.y + Math.cos(sr) * 120 };
      // head tilt off the trunk line: from rounding (round) AND/OR just LOOKING DOWN (headDown, deg).
      // headDown tilts the head only (no torso shortening) — the ear proxy fires but shrink does NOT,
      // so it must NOT trip the high-confidence (both-proxy) rounding gate.
      const headDown = (o.headDown || 0) * Math.PI / 180;
      const dir = br + face * (round * 35 * Math.PI / 180 + headDown);
      const ear = { x: shoulder.x + face * Math.sin(dir) * 45, y: shoulder.y - Math.cos(dir) * 45 };
      const nose = { x: ear.x + face * 15, y: ear.y + 5 };
      const mk = (n, p, s) => ({ name: n, x: p.x + J(), y: p.y + J(), score: s == null ? 1 : s });
      return [
        mk('left_shoulder', shoulder), mk('left_hip', hip), mk('left_knee', knee), mk('left_ankle', ankle),
        mk('left_ear', ear, earVis), mk('nose', nose, noseVis),
        mk('right_shoulder', { x: shoulder.x + 6, y: shoulder.y }), mk('right_hip', { x: hip.x + 6, y: hip.y }),
        mk('right_knee', { x: knee.x + 6, y: knee.y }), mk('right_ankle', { x: ankle.x + 6, y: ankle.y }),
        mk('right_ear', ear, earVis),
      ];
    }
    window.__dlSelfTest = function () {
      if (exercise !== 'deadlift') return { error: 'open the page with ?exercise=deadlift to run this test' };
      const snap = __snap(), dt = 50;
      const calib = (n) => Array.from({ length: n }, () => ({ kps: __dlPose({ backFromVert: 5 }), phase: 'calib' }));
      // kneeBend 70 => knee angle ~110° (a CONVENTIONAL deadlift depth). The old 40 (~140°) is now
      // correctly rejected as RDL-like, so the synthetic "good" pull must flex the knees properly.
      const pull = (n, o) => Array.from({ length: n }, () => ({ kps: __dlPose(Object.assign({ backFromVert: 80, kneeBend: 70 }, o)), phase: 'pull' }));
      const lock = (n) => Array.from({ length: n }, () => ({ kps: __dlPose({ backFromVert: 5 }), phase: 'lock' }));
      function run(frames) {
        __resetState();
        let clk = 100000, pullStart = null, firstBadMs = null; const pullStates = [];
        for (const fr of frames) {
          clk += dt;
          window.__feed(fr.kps, clk);
          if (fr.phase === 'pull') {
            if (pullStart === null) pullStart = clk;
            pullStates.push(committedState);
            if (committedState === 'bad' && firstBadMs === null) firstBadMs = clk - pullStart;
          }
        }
        return { count, bad: badCount, unverified: unverifiedCount, pullStates, firstBadMs, verdict: verdictKind };
      }
      // (a) NEUTRAL good pull -> counts.  (b) ROUNDED back: with HIGH-CONFIDENCE rounding both proxies
      // (ear-angle + torso-shortening) agree and sustain, so this valid-movement pull is REJECTED.
      const a = run([...calib(10), ...pull(10, { round: 0 }), ...lock(5)]);
      const b = run([...calib(10), ...pull(14, { round: 1 }), ...lock(5)]);
      const c = run([...calib(10), ...pull(14, { round: 1, headVis: 0 }), ...lock(5)]);
      // (d) FLICKER: a rounded back whose tracking drops out every 3rd frame. The one-missed-frame gap
      // tolerance bridges the dropouts so the high-confidence rounding run still accumulates -> REJECTED.
      const dFrames = [...calib(10)];
      for (let i = 0; i < 18; i++) dFrames.push({ kps: __dlPose({ backFromVert: 80, kneeBend: 70, round: (i % 3 === 2) ? 0 : 1 }), phase: 'pull' });
      const d = run([...dFrames, ...lock(5)]);
      // (d2) same flicker but more strongly rounded (round 1.4) — also REJECTED.
      const d2Frames = [...calib(10)];
      for (let i = 0; i < 18; i++) d2Frames.push({ kps: __dlPose({ backFromVert: 80, kneeBend: 70, round: (i % 3 === 2) ? 0 : 1.4 }), phase: 'pull' });
      const d2 = run([...d2Frames, ...lock(5)]);
      // (e) HEAD HIDDEN -> UNVERIFIED: not counted, not bad, amber verdict flash.
      const e = run([...calib(10), ...pull(16, { round: 0, headVis: 0 }), ...lock(5)]);
      // (f) JITTER -> GOOD: neutral back with noisy landmarks must still count as a good rep.
      const f = run([...calib(12), ...pull(12, { round: 0, jitter: 2.5 }), ...lock(6)]);
      // (g) HEAD-SOURCE SWITCH -> no false BAD: ears vanish mid-pull, nose takes over. The nose has no
      // calibrated baseline, so the ear signal must simply go unavailable (never a false rounding flag).
      const g = run([...calib(10), ...pull(6, { round: 0 }), ...pull(10, { round: 0, earVis: 0, noseVis: 1 }), ...lock(5)]);
      // (h) RDL-DEPTH -> REJECTED: deep hip hinge but knees stay nearly straight (kneeBend 20 => knee
      // ~160°). A conventional deadlift must flex the knees, so this is NOT counted (the core conversion).
      const rdlPull = (n) => Array.from({ length: n }, () => ({ kps: __dlPose({ backFromVert: 80, kneeBend: 20, round: 0 }), phase: 'pull' }));
      const h = run([...calib(10), ...rdlPull(12), ...lock(5)]);
      // (i) LOOK-DOWN but NEUTRAL back -> COUNTS: head tilted down (ear proxy fires) but the torso is
      // NOT shortened (shrink proxy does not fire), so the high-confidence (both-proxy) gate must NOT
      // trip. This is the guarantee that glancing at the floor won't false-reject a good deadlift.
      const i = run([...calib(10), ...pull(14, { round: 0, headDown: 45 }), ...lock(5)]);
      // (j) FORWARD-LEANING SQUAT -> REJECTED: deep knees (kneeBend 90 => knee ~90°) AND a real forward
      // torso lean of 45° — which CLEARS the 38° lean gate, so lean alone can't reject it. But a squat
      // leans its SHIN forward with the torso (shinFromVert 40), so the torso-minus-shin separation at the
      // bottom is only ~5° (far below minTorsoShinSep 22). A real deadlift keeps the shin near-vertical, so
      // the separation is large. This is the case the user hit (a sideways squat counting) — now REJECTED.
      const squatPull = (n) => Array.from({ length: n }, () => ({ kps: __dlPose({ backFromVert: 45, kneeBend: 90, shinFromVert: 40, round: 0 }), phase: 'pull' }));
      const j = run([...calib(10), ...squatPull(12), ...lock(5)]);

      __restore(snap);
      const res = {
        a_neutral: { pass: a.count === 1 && a.bad === 0 && a.pullStates.includes('good') && !a.pullStates.includes('bad'), ...a },
        b_rounded: { pass: b.count === 0 && b.bad === 1, ...b },   // high-confidence (both proxies) rounding -> REJECTED
        c_headHidden: { pass: c.pullStates.length > 0 && c.pullStates.every(s => s === 'unknown'), ...c },
        d_flicker: { pass: d.count === 0 && d.bad === 1, ...d },       // rounded + flicker still caught (gap-tolerant)
        d2_flickerStrong: { pass: d2.count === 0 && d2.bad === 1, ...d2 },  // strongly rounded -> REJECTED
        e_unverified: { pass: e.unverified === 1 && e.count === 0 && e.bad === 0 && e.verdict === 'amber', ...e },
        f_jitter: { pass: f.count === 1 && f.bad === 0 && f.unverified === 0, ...f },
        g_headSwitch: { pass: g.bad === 0 && g.count === 1, ...g },
        h_rdlRejected: { pass: h.count === 0 && h.bad === 1, ...h },
        i_lookDownCounts: { pass: i.count === 1 && i.bad === 0, ...i },   // look down, neutral back -> still counts
        j_squatNotCounted: { pass: j.count === 0 && j.bad === 1, ...j },  // forward-leaning squat -> actively REJECTED (torso-shin separation)
      };
      res.allPass = ['a_neutral', 'b_rounded', 'c_headHidden', 'd_flicker', 'd2_flickerStrong', 'e_unverified', 'f_jitter', 'g_headSwitch', 'h_rdlRejected', 'i_lookDownCounts', 'j_squatNotCounted']
        .every(k => res[k].pass);
      return res;
    };

    /* =========================================================================
       ERROR HANDLING
       ========================================================================= */
    function showFatal(err) {
      const name = err && err.name, text = (err && err.message) || '';
      let msg;
      if (name === 'NotAllowedError' || name === 'PermissionDeniedError') msg = 'Camera permission is blocked. Allow camera access and reopen.';
      else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') msg = 'No camera was found on this device.';
      else if (name === 'NotReadableError' || name === 'TrackStartError') msg = 'The camera is in use by another app. Close it and reopen.';
      else if (text === 'MODEL_LOAD_TIMEOUT') msg = 'The AI model took too long to load. Check your connection and reopen.';
      else if (text === 'MP_IMPORT_FAILED' || /import|fetch|network|load|wasm/i.test(text)) msg = "Couldn't load the AI model library. Check your internet connection and reopen.";
      else if (text === 'GPU_AND_CPU_FAILED') msg = "Couldn't initialize the pose engine on this device.";
      else msg = "Couldn't start the AR camera. Please try again.";
      // In MINIMAL_UI, draw NO floating text on the camera view — React Native shows the error
      // outside the AR view via the existing 'error' handler (Alert/Modal). Still always send it.
      if (!MINIMAL_UI) { statusEl.textContent = msg; statusEl.style.color = '#E24B4A'; debugEl.textContent = text ? 'Error: ' + text : ''; }
      send({ type: 'error', message: msg });
    }

    function withTimeout(promise, ms, message) {
      let timer;
      const timeout = new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(message)), ms); });
      return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
    }

    async function init() {
      try {
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false,
          });
        } catch (camErr) { showFatal(camErr); return; }

        video.srcObject = stream;
        await new Promise(r => { video.onloadedmetadata = r; });
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;

        let visionMod;
        try { visionMod = await import(MP + '/vision_bundle.mjs'); }
        catch (e) { throw new Error('MP_IMPORT_FAILED'); }
        const { PoseLandmarker, FilesetResolver } = visionMod;

        const setup = async () => {
          const fileset = await FilesetResolver.forVisionTasks(MP + '/wasm');
          const make = delegate => PoseLandmarker.createFromOptions(fileset, {
            baseOptions: { modelAssetPath: MODEL_URL, delegate },
            runningMode: 'VIDEO', numPoses: 1,
            minPoseDetectionConfidence: 0.5, minPosePresenceConfidence: 0.5, minTrackingConfidence: 0.5,
          });
          try { delegateName = 'GPU'; return await make('GPU'); }
          catch (gpuErr) {
            try { delegateName = 'CPU'; return await make('CPU'); }
            catch (cpuErr) { throw new Error('GPU_AND_CPU_FAILED'); }
          }
        };
        detector = await withTimeout(setup(), MODEL_LOAD_TIMEOUT_MS, 'MODEL_LOAD_TIMEOUT');

        await new Promise(r => { if (video.readyState >= 2) r(); else video.onloadeddata = r; });
        try { detector.detectForVideo(video, performance.now()); } catch (e) { /* warm-up; real frames retry */ }

        statusEl.textContent = 'Get into position';
        statusEl.style.color = '#fff';

        // Detection runs immediately; rep counting is gated behind readiness + countdown (started flag).
        requestAnimationFrame(loop);
      } catch (err) {
        showFatal(err);
      }
    }
    init();
  </script>
</body>
</html>
