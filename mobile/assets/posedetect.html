<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    #hud { position: absolute; top: 20px; left: 0; right: 0; z-index: 10; text-align: center; color: #fff; font-family: sans-serif; }
    #repcount { font-size: 64px; font-weight: bold; }
    #status { font-size: 18px; padding: 0 16px; }
    #debug { font-size: 14px; color: #FFD700; margin-top: 8px; font-weight: bold; white-space: pre-line; }
    #wrap { position: relative; width: 100vw; height: 100vh; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #formBorder {
      position: absolute; inset: 0; z-index: 9; pointer-events: none;
      border: 0px solid transparent; box-sizing: border-box;
      transition: border-color 0.15s ease, border-width 0.15s ease;
    }
    /* Slow amber pulse before the countdown ends, so the user sees the app is waiting (not frozen). */
    #formBorder.amber-pulse { animation: amberPulse 1.6s ease-in-out infinite; }
    @keyframes amberPulse {
      0%, 100% { border-color: rgba(245, 166, 35, 0.32); }
      50%      { border-color: rgba(245, 166, 35, 0.85); }
    }
    #countdownOverlay {
      position: absolute; inset: 0; z-index: 20; display: none;
      align-items: center; justify-content: center; flex-direction: column;
      background: rgba(0, 0, 0, 0.45);
    }
    #countdownRing {
      position: relative; width: 170px; height: 170px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: conic-gradient(#5DCAA5 var(--progress, 360deg), rgba(255, 255, 255, 0.18) 0deg);
      transition: background 0.3s linear;
    }
    #countdownInner {
      width: 142px; height: 142px; border-radius: 50%; background: #0a0a0a;
      display: flex; align-items: center; justify-content: center;
    }
    #countdownNumber { font-family: sans-serif; font-size: 56px; font-weight: bold; color: #fff; }
    #countdownNumber.pulse { animation: countPulse 0.35s ease-out; }
    @keyframes countPulse { 0% { transform: scale(1.25); opacity: 0.3; } 100% { transform: scale(1); opacity: 1; } }
    #countdownLabel { margin-top: 20px; font-family: sans-serif; font-size: 18px; color: #fff; opacity: 0.85; text-align: center; padding: 0 24px; }

    /* Tracking-quality chip + tappable setup hint (deadlift back-form aid) */
    #qualityChip {
      position: absolute; left: 50%; transform: translateX(-50%);
      bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 15; display: none;
      background: rgba(0, 0, 0, 0.62); color: #FFD24A; font-family: sans-serif; font-size: 13px;
      font-weight: bold; padding: 8px 14px; border-radius: 18px; border: 1px solid rgba(255, 210, 74, 0.5);
      max-width: 90vw; text-align: center;
    }
    #setupHint {
      position: absolute; left: 16px; right: 16px; bottom: calc(64px + env(safe-area-inset-bottom, 0px));
      z-index: 16; display: none; background: rgba(18, 18, 18, 0.93); color: #fff; font-family: sans-serif;
      font-size: 13px; line-height: 1.55; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(93, 202, 165, 0.4);
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="repcount">0</div>
    <div id="status">Loading model...</div>
    <div id="debug">--</div>
  </div>
  <div id="wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="formBorder"></div>
    <div id="qualityChip"></div>
    <div id="setupHint"></div>

    <div id="countdownOverlay">
      <div id="countdownRing"><div id="countdownInner"><div id="countdownNumber">5</div></div></div>
      <div id="countdownLabel">Get into position</div>
    </div>
  </div>

  <script>
    /* =========================================================================
       VisionFit 360 — posedetect.html
       Pose-estimation-based exercise form analysis (MediaPipe Pose Landmarker).

       IMPORTANT SCOPE NOTE:
       This is pose-estimation-based form analysis, NOT medical-grade biomechanics.
       MediaPipe does not provide vertebra-level landmarks, so nothing here is
       "direct spinal curvature detection". Deadlift analysis = trunk-alignment
       proxy + hip-hinge analysis + knee-position analysis + temporal rule-based
       validation + OPTIONAL experimental ML augmentation.
       ========================================================================= */

    function send(obj) {
      if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(obj));
      if (obj.type === 'counter') document.getElementById('repcount').textContent = obj.current_count;
    }

    const params = new URLSearchParams(window.location.search);
    const exercise = params.get('exercise') || 'squat';

    // ---- ARM SELECTOR (bicep curl / front raise / lateral raise) ----
    // ?arm=left or ?arm=right restricts counting + feedback to that arm only; default
    // 'either' tracks both. A disabled arm is treated as not visible and never advanced,
    // so it can't count, pair, or turn the border red.
    const ARM_SEL = ['left', 'right'].includes(params.get('arm')) ? params.get('arm') : 'either';
    function armEnabled(side) { return ARM_SEL === 'either' || ARM_SEL === side; }

    // ---- A/B SWITCHES (override from the page URL) ----
    const USE_WORLD_ANGLES = params.get('angles') !== '2d';        // 3D joint angles (&angles=2d = image-pixel angles)
    const USE_BODY_SCALE   = params.get('scale')  !== '0';         // body-relative pixel thresholds (&scale=0 = fixed pixels)
    const COUNT_MIN_VIS    = params.get('gate') === '0' ? 0 : 0.5; // joints below this visibility are ignored when counting
    const VARIANT = ['lite', 'full', 'heavy'].includes(params.get('variant')) ? params.get('variant') : 'full';

    // ---- DEADLIFT-SPECIFIC SWITCHES ----
    // dlmode: rules (default) | ml | hybrid.  dlvar: standard (default) | rdl | sumo.
    const DLMODE = ['rules', 'ml', 'hybrid'].includes(params.get('dlmode')) ? params.get('dlmode') : 'rules';
    const DLVAR  = ['standard', 'rdl', 'sumo'].includes(params.get('dlvar')) ? params.get('dlvar') : 'standard';
    const DL_RECORD = params.get('dlrec') === '1';                 // per-REP recording mode for training data
    const DL_REC_FRAME = params.get('dlrecframe') === '1';         // per-FRAME back-posture label mode (threshold tuning)
    const DL_LABEL  = params.get('dllabel') === 'bad' ? 0 : 1;     // 1 = good form, 0 = bad form (for recording)
    // 2b.5: per-rep severity label for recording — good | mild | obvious (?dlsev=). 'good' keeps label 1.
    const DL_SEV = ['good', 'mild', 'obvious'].includes(params.get('dlsev')) ? params.get('dlsev')
                 : (DL_LABEL === 1 ? 'good' : 'obvious');
    const DL_PERSON = params.get('person') || 'p1';                // person id for person-grouped validation

    /* ---- MINIMAL UI (presentation only) ----
       Camera view shows ONLY: camera + skeleton, rep count, countdown ring/number, and the border.
       All status/debug/fps/quality/setup/countdown-label text is hidden. ?ui=full (or ?debug=1)
       restores the old text/debug UI for development. Nothing about detection/counting changes. */
    const MINIMAL_UI = params.get('ui') !== 'full' && params.get('debug') !== '1';

    // Rep-verdict border flash (presentation only; does NOT touch committedState / counting).
    const VERDICT_GOOD_MS = 600;   // green flash when a rep is COUNTED
    const VERDICT_BAD_MS  = 900;   // red flash when a rep is NOT counted (incl. depth/lockout/incomplete)
    const VERDICT_AMBER_MS = 700;  // amber flash when a rep is UNVERIFIED (2b.1) — not counted, not bad
    // 2b.1: if true, an UNVERIFIED rep (too little judgeable coverage) is evaluated/counted normally.
    const UNVERIFIED_REP_COUNTS = false;
    // Optional: if true, any confirmed RED (committedState==='bad') during a rep makes that rep NOT count.
    // Default false -> existing counting rules stand and the verdict flash shows the real outcome.
    const STRICT_RED_FAILS_REP = false;
    // Optional: short vibration on a not-counted rep (navigator.vibrate + a 'haptic' message to RN).
    const HAPTICS = false;

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const debugEl = document.getElementById('debug');
    const statusEl = document.getElementById('status');
    const formBorder = document.getElementById('formBorder');
    const qualityChip = document.getElementById('qualityChip');
    const setupHint = document.getElementById('setupHint');

    let detector = null, count = 0, badCount = 0, unverifiedCount = 0, lastAngle = 180;
    let NOW = 0;                                 // performance.now() for the current frame (also used by replay hook)
    const MIN_SCORE = 0.5;                       // skeleton drawing threshold
    const SKELETON_COLOR = '#000000';

    const MP_VERSION = '';
    const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision' + (MP_VERSION ? '@' + MP_VERSION : '');
    const MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_' +
      VARIANT + '/float16/1/pose_landmarker_' + VARIANT + '.task';
    const MODEL_LOAD_TIMEOUT_MS = 60000;

    // ---- BODY-SCALE NORMALIZATION ----
    // Torso length (shoulder->hip) is the reference. REF_TORSO_PX is a practical baseline;
    // NOTE: a single camera resolution does not represent all real-world geometry, so we clamp
    // bodyScale to a safe range and never treat it as an absolute physical measurement.
    const REF_TORSO_PX = 110;
    let torsoPx = 0, bodyScale = 1;

    // ---- SIDE SELECTION (with hysteresis + dwell so occlusion doesn't flip sides) ----
    const SIDE_SWITCH_MARGIN = 0.4;
    const SIDE_SWITCH_MIN_MS = 600;
    let activeSide = 'left';
    let lastSideSwitchMs = 0;

    // ---- FORM / REP TIMING CONSTANTS ----
    const REST_RESET_MS = 2500;     // if resting (ready) this long, clear temporary bad-form state
    const POSE_GAP_MS   = 700;      // generic: brief disappearance -> reset incomplete rep, no count
    const POSE_GAP_DL_MS = 1100;    // deadlift tolerates slightly longer gaps

    const fpsEl = document.createElement('div');
    fpsEl.style.cssText = 'font-size:12px;color:#9aa0a6;margin-top:4px;white-space:pre-line;';
    document.getElementById('hud').appendChild(fpsEl);
    const DEBUG_ON = params.get('debug') !== '0';
    if (!DEBUG_ON) { debugEl.style.display = 'none'; fpsEl.style.display = 'none'; }

    // MINIMAL_UI: hide ALL on-screen text so the camera view shows only skeleton + rep count +
    // countdown ring/number + border. (Detection code still runs and still writes to these hidden
    // elements; the writes are simply invisible — see also the guards in dlQuality()/showFatal().)
    if (MINIMAL_UI) {
      statusEl.style.display = 'none';
      debugEl.style.display = 'none';
      fpsEl.style.display = 'none';
      if (qualityChip) qualityChip.style.display = 'none';
      if (setupHint) setupHint.style.display = 'none';
      const cl = document.getElementById('countdownLabel'); if (cl) cl.style.display = 'none';
    }

    let frameCount = 0, lastFpsTime = performance.now(), delegateName = '', curFps = 0;
    setInterval(() => {
      const now = performance.now();
      curFps = frameCount / ((now - lastFpsTime) / 1000);
      if (DEBUG_ON) {
        fpsEl.textContent = [
          VARIANT, delegateName || '...', curFps.toFixed(1) + ' fps',
          USE_WORLD_ANGLES ? '3D' : '2D',
          COUNT_MIN_VIS ? 'gate' : 'nogate',
          USE_BODY_SCALE ? 'scale' : 'noscale',
          torsoPx ? 'torso ' + Math.round(torsoPx) + 'px' : 'torso -',
          exercise === 'deadlift' ? ('dl:' + DLMODE + '/' + DLVAR + (dlModel ? ' model' : ' no-model') + (mlAllowedNow() ? ' ml-on' : ' ml-off')) : '',
        ].filter(Boolean).join(' · ');
      }
      frameCount = 0;
      lastFpsTime = now;
    }, 1000);

    // ---- LANDMARKS (ears 7/8 added as an extra trunk/head-alignment signal for deadlift) ----
    const LM_NAMES = {
      0: 'nose', 7: 'left_ear', 8: 'right_ear',
      11: 'left_shoulder', 12: 'right_shoulder', 13: 'left_elbow', 14: 'right_elbow',
      15: 'left_wrist', 16: 'right_wrist', 23: 'left_hip', 24: 'right_hip',
      25: 'left_knee', 26: 'right_knee', 27: 'left_ankle', 28: 'right_ankle',
    };
    function toKeypoints(lms, wlms, w, h) {
      return Object.keys(LM_NAMES).map(i => {
        const l = lms[i];
        const wl = wlms ? wlms[i] : null;
        return {
          name: LM_NAMES[i], x: l.x * w, y: l.y * h, score: l.visibility ?? 1,
          wx: wl ? wl.x : undefined, wy: wl ? wl.y : undefined, wz: wl ? wl.z : undefined,
        };
      });
    }

    const CONNECTIONS = [
      ['left_shoulder','right_shoulder'],['left_shoulder','left_elbow'],['left_elbow','left_wrist'],
      ['right_shoulder','right_elbow'],['right_elbow','right_wrist'],
      ['left_shoulder','left_hip'],['right_shoulder','right_hip'],['left_hip','right_hip'],
      ['left_hip','left_knee'],['left_knee','left_ankle'],
      ['right_hip','right_knee'],['right_knee','right_ankle'],
    ];

    // ---- GEOMETRY ----
    function angle2D(a, b, c) {
      const ab = { x: a.x - b.x, y: a.y - b.y };
      const cb = { x: c.x - b.x, y: c.y - b.y };
      const dot = ab.x * cb.x + ab.y * cb.y;
      const magAB = Math.hypot(ab.x, ab.y), magCB = Math.hypot(cb.x, cb.y);
      if (magAB === 0 || magCB === 0) return lastAngle;
      return Math.acos(Math.max(-1, Math.min(1, dot / (magAB * magCB)))) * (180 / Math.PI);
    }
    function angle3D(a, b, c) {
      const ab = { x: a.wx - b.wx, y: a.wy - b.wy, z: a.wz - b.wz };
      const cb = { x: c.wx - b.wx, y: c.wy - b.wy, z: c.wz - b.wz };
      const dot = ab.x * cb.x + ab.y * cb.y + ab.z * cb.z;
      const magAB = Math.hypot(ab.x, ab.y, ab.z), magCB = Math.hypot(cb.x, cb.y, cb.z);
      if (magAB === 0 || magCB === 0) return lastAngle;
      return Math.acos(Math.max(-1, Math.min(1, dot / (magAB * magCB)))) * (180 / Math.PI);
    }
    function ang(a, b, c) {
      if (USE_WORLD_ANGLES && a.wx !== undefined && b.wx !== undefined && c.wx !== undefined) return angle3D(a, b, c);
      return angle2D(a, b, c);
    }
    function dist3D(a, b) {
      if (a.wx !== undefined && b.wx !== undefined) return Math.hypot(a.wx - b.wx, a.wy - b.wy, a.wz - b.wz);
      return Math.hypot(a.x - b.x, a.y - b.y);
    }
    // Deviation of a segment from true vertical, in degrees (0 = perfectly upright).
    function verticalDeg(top, bottom) {
      const dx = Math.abs(top.x - bottom.x), dy = Math.abs(top.y - bottom.y);
      return Math.atan2(dx, Math.max(dy, 1e-6)) * (180 / Math.PI);
    }

    // ---- KEYPOINT ACCESS ----
    function kp(keypoints, name) {                 // visibility-gated (for counting / form)
      const k = keypoints.find(k => k.name === name);
      if (!k) return undefined;
      if (COUNT_MIN_VIS && k.score < COUNT_MIN_VIS) return undefined;
      return k;
    }
    function kpRaw(keypoints, name) { return keypoints.find(k => k.name === name); }
    function jointVisible(keypoints, joint) {       // either side visible at >=0.5
      const l = kpRaw(keypoints, 'left_' + joint), r = kpRaw(keypoints, 'right_' + joint);
      return (l && (l.score ?? 1) >= 0.5) || (r && (r.score ?? 1) >= 0.5);
    }

    // Average left+right of a joint-angle when both sides visible; else fall back to one side.
    function angBoth(keypoints, jointA, jointB, jointC) {
      const lA = kp(keypoints, 'left_' + jointA), lB = kp(keypoints, 'left_' + jointB), lC = kp(keypoints, 'left_' + jointC);
      const rA = kp(keypoints, 'right_' + jointA), rB = kp(keypoints, 'right_' + jointB), rC = kp(keypoints, 'right_' + jointC);
      const leftOk = lA && lB && lC, rightOk = rA && rB && rC;
      if (leftOk && rightOk) return { value: (ang(lA, lB, lC) + ang(rA, rB, rC)) / 2, sides: 'both' };
      if (leftOk) return { value: ang(lA, lB, lC), sides: 'left' };
      if (rightOk) return { value: ang(rA, rB, rC), sides: 'right' };
      return null;
    }

    // ---- SMOOTHING: keyed EMA (no per-frame allocation, no cross-signal contamination) ----
    const ema = {};
    function smoothV(key, val, alpha) {
      alpha = alpha === undefined ? 0.4 : alpha;
      if (ema[key] === undefined) ema[key] = val;
      else ema[key] = ema[key] * (1 - alpha) + val * alpha;
      return ema[key];
    }

    function pickSide(keypoints, joints) {
      const sideScore = (side) => joints.reduce((t, j) => {
        const k = kpRaw(keypoints, side + '_' + j);
        return t + (k && k.score ? k.score : 0);
      }, 0);
      const l = sideScore('left'), r = sideScore('right');
      if (NOW - lastSideSwitchMs >= SIDE_SWITCH_MIN_MS) {
        let next = activeSide;
        if (activeSide === 'left' && r > l + SIDE_SWITCH_MARGIN) next = 'right';
        else if (activeSide === 'right' && l > r + SIDE_SWITCH_MARGIN) next = 'left';
        if (next !== activeSide) { activeSide = next; lastSideSwitchMs = NOW; }
      }
      return activeSide;
    }

    function updateBodyScale(keypoints) {
      if (!USE_BODY_SCALE) { bodyScale = 1; return; }
      const lens = [];
      ['left', 'right'].forEach(side => {
        const s = kp(keypoints, side + '_shoulder'), h = kp(keypoints, side + '_hip');
        if (s && h) {
          const dx = Math.abs(s.x - h.x), dy = Math.abs(s.y - h.y);
          if (dy > 0 && dx < dy * 0.6) lens.push(Math.hypot(dx, dy));
        }
      });
      if (!lens.length) return;
      const cur = lens.reduce((a, b) => a + b, 0) / lens.length;
      torsoPx = torsoPx ? torsoPx * 0.9 + cur * 0.1 : cur;
      bodyScale = Math.max(0.4, Math.min(3, torsoPx / REF_TORSO_PX));
    }

    const kpHistory = {};
    function smoothKp(k) {
      if (!k) return k;
      if (!kpHistory[k.name]) kpHistory[k.name] = { x: k.x, y: k.y };
      const prev = kpHistory[k.name];
      const sx = prev.x * 0.5 + k.x * 0.5, sy = prev.y * 0.5 + k.y * 0.5;
      kpHistory[k.name] = { x: sx, y: sy };
      return { ...k, x: sx, y: sy };
    }

    /* =========================================================================
       FORM STATE: 'good' | 'bad' | 'unknown'
       - unknown = not enough evidence (e.g. missing landmarks). NEVER auto-"bad".
       - stale GOOD is avoided: every frame re-derives the state.
       ========================================================================= */
    // formState/formMsg are the RAW per-frame intent each detector writes. They are NOT shown
    // directly — commitForm() (below) applies temporal hysteresis so the border/message never
    // flicker on one noisy frame.
    let formState = 'unknown', formMsg = '';
    function setForm(state, msg) { formState = state; formMsg = (state === 'bad') ? (msg || '') : ''; }
    // Lets a detector carry a message on GOOD/UNKNOWN too (e.g. "Good form - straight back",
    // or a non-accusatory amber reason) without implying bad form.
    function setFormRaw(state, msg) { formState = state; formMsg = msg || ''; }

    /* =========================================================================
       CENTRALIZED FORM-STATE COMMIT LAYER (one place; every exercise shares it)
       Raw per-frame state -> temporally-confirmed committed state that drives BOTH the
       AR border colour and the `form` message (so they always agree).
       - A state change must persist for its confirm window before it is committed
         (hysteresis) -> a single noisy frame never flips the border.
       - Priority once confirmed: BAD (red) > GOOD (green) > UNKNOWN (amber).
       - RED is LATCHED for RED_LATCH_MS after a confirmed fault so the user actually sees it.
       - GREEN is only shown on positive good evidence, never merely because BAD wasn't seen.
       ========================================================================= */
    const COMMIT_BAD_MS = 150;      // NEW: raw 'bad' must hold this long before the border goes RED
    const COMMIT_GOOD_MS = 250;     // NEW: raw 'good' must hold this long before returning to GREEN
    const COMMIT_UNKNOWN_MS = 200;  // NEW: raw 'unknown' must hold this long before going AMBER
    const RED_LATCH_MS = 800;       // NEW: keep RED on screen at least this long after a confirmed fault
    let committedState = 'unknown', committedMsg = '';
    let rawRun = null, rawRunSince = 0, redUntil = 0;

    let lastFormSent = null;
    function resetFormCommit() {
      committedState = 'unknown'; committedMsg = '';
      rawRun = null; rawRunSince = 0; redUntil = 0; lastFormSent = null;
    }
    function commitForm() {
      if (formState !== rawRun) { rawRun = formState; rawRunSince = NOW; }
      // RED latch: hold red briefly after a confirmed fault so it's actually visible.
      if (committedState === 'bad' && NOW < redUntil) {
        if (formState === 'bad') { committedMsg = formMsg || committedMsg; redUntil = Math.max(redUntil, NOW + RED_LATCH_MS); }
        return;
      }
      if (formState === committedState) {
        committedMsg = committedState === 'good' ? (formMsg || 'Good form')
                     : committedState === 'bad' ? (formMsg || committedMsg || 'Fix your form')
                     : (formMsg || 'Position unclear');
        return;
      }
      const need = formState === 'bad' ? COMMIT_BAD_MS : formState === 'good' ? COMMIT_GOOD_MS : COMMIT_UNKNOWN_MS;
      if (NOW - rawRunSince >= need) {
        committedState = formState;
        committedMsg = formState === 'good' ? (formMsg || 'Good form')
                     : formState === 'bad' ? (formMsg || 'Fix your form') : (formMsg || 'Position unclear');
        if (formState === 'bad') redUntil = NOW + RED_LATCH_MS;
      }
      // else: hold the previous committed state through brief noise.
    }

    // REP-VERDICT FLASH (presentation only): briefly overrides the border with the real counting
    // decision when a rep finishes, so a rep rejected for depth/lockout/form is never silent.
    // It does NOT modify committedState, so __form / __dlSelfTest are unaffected.
    // kind: 'good' (counted) | 'bad' (not counted) | 'amber' (UNVERIFIED — 2b.1)
    let verdictUntil = 0, verdictKind = null;
    function flashVerdict(kind) {
      if (kind === true) kind = 'good'; else if (kind === false) kind = 'bad';   // back-compat
      verdictKind = kind;
      verdictUntil = NOW + (kind === 'good' ? VERDICT_GOOD_MS : kind === 'bad' ? VERDICT_BAD_MS : VERDICT_AMBER_MS);
    }

    // AR border: GREEN = good form / rep counted, RED = bad form / rep not counted, AMBER = unclear/not ready.
    // Widths are distinct per state (good thin, amber medium, bad thick) so states read without colour.
    function applyBorder(state) {
      if (NOW < verdictUntil && verdictKind) {               // verdict flash wins while active
        if (verdictKind === 'good') { formBorder.style.borderColor = 'rgba(46,204,113,0.95)'; formBorder.style.borderWidth = '14px'; }
        else if (verdictKind === 'amber') { formBorder.style.borderColor = 'rgba(245,166,35,0.95)'; formBorder.style.borderWidth = '18px'; }
        else { formBorder.style.borderColor = '#E24B4A'; formBorder.style.borderWidth = '26px'; }
        return;
      }
      if (state === 'good') { formBorder.style.borderColor = 'rgba(29,158,117,0.65)'; formBorder.style.borderWidth = '8px'; }
      else if (state === 'bad') { formBorder.style.borderColor = '#E24B4A'; formBorder.style.borderWidth = '22px'; }
      else { formBorder.style.borderColor = 'rgba(245,166,35,0.6)'; formBorder.style.borderWidth = '10px'; } // amber = unknown
    }

    function sendFormIfChanged() {
      const key = committedState + '|' + committedMsg;
      if (key === lastFormSent) return;
      lastFormSent = key;
      // `good` kept for backward compatibility: true unless confirmed BAD (AMBER never shows a red border downstream).
      send({ type: 'form', good: committedState !== 'bad', state: committedState, msg: committedMsg });
    }

    /* =========================================================================
       REP LIFECYCLE ENGINE
       READY -> (enter) ACTIVE -> track extreme & accumulate form evidence -> (exit) VALID / INVALID
       - hysteresis (enter != exit)
       - debounce (min ms between reps)
       - depth/lockout validation via tracked extreme
       - bad-form evidence ratio over the rep
       ========================================================================= */
    const R = {
      stage: 'ready', lastRepMs: 0, readySinceMs: 0,
      extreme: null, activeFrames: 0, evalFrames: 0, badFrames: 0, repValid: true,
    };

    function rep() {
      count++;
      send({ type: 'counter', current_count: count });
      statusEl.textContent = 'REP ' + count + '!';   // (hidden in MINIMAL_UI; kept for ?ui=full)
      statusEl.style.color = '#5DCAA5';
      flashVerdict(true);                             // GREEN flash: rep counted
    }
    // 2b.1: UNVERIFIED rep — we could not judge enough of it. NOT counted and NOT a bad rep.
    function repUnverified(reason) {
      unverifiedCount++;
      send({ type: 'rep_unverified', current_unverified: unverifiedCount, reason: reason || 'Could not verify this rep' });
      statusEl.textContent = reason || 'Could not verify this rep';   // hidden in MINIMAL_UI
      statusEl.style.color = '#FFD24A';
      flashVerdict('amber');
    }
    function badRep(reason) {
      badCount++;
      send({ type: 'bad_rep', current_bad: badCount, reason: reason || 'Fix your form' });
      statusEl.textContent = reason || 'Fix your form';
      statusEl.style.color = '#E24B4A';
      flashVerdict(false);                            // RED flash: rep NOT counted
      if (HAPTICS) { try { if (navigator.vibrate) navigator.vibrate(200); } catch (e) {} send({ type: 'haptic', ms: 200 }); }
    }

    function repStart(onActive) {
      R.stage = 'active';
      R.activeFrames = 0; R.evalFrames = 0; R.badFrames = 0; R.extreme = null; R.repValid = true;
      if (onActive) onActive();
    }
    function repFrame(evaluable, bad, metric, track) {
      R.activeFrames++;
      if (evaluable) { R.evalFrames++; if (bad) R.badFrames++; }
      if (metric !== undefined && metric !== null) {
        if (R.extreme === null) R.extreme = metric;
        else R.extreme = track === 'min' ? Math.min(R.extreme, metric) : Math.max(R.extreme, metric);
      }
    }
    // Returns: 'good' | 'bad' | 'debounced' | 'tooShort'
    function repFinish(cfg) {
      R.stage = 'ready'; R.readySinceMs = NOW;
      if (NOW - R.lastRepMs < (cfg.debounceMs || 300)) return 'debounced';
      if (R.activeFrames < (cfg.minActiveFrames || 2)) return 'tooShort';
      R.lastRepMs = NOW;
      let complete = true, reason = '';
      if (cfg.target !== undefined && R.extreme !== null) {
        complete = cfg.track === 'min' ? R.extreme <= cfg.target : R.extreme >= cfg.target;
        if (!complete) reason = cfg.incompleteMsg || 'Incomplete rep';
      }
      const badRatio = R.evalFrames ? R.badFrames / R.evalFrames : 0;
      const formBad = R.evalFrames >= (cfg.minEvalFrames || 3) && badRatio > (cfg.badRatio || 0.4);
      const strictBad = STRICT_RED_FAILS_REP && committedState === 'bad';  // optional flag (default off)
      if (!complete || formBad || strictBad) { badRep(reason || cfg.formMsg || 'Fix your form'); return 'bad'; }
      rep(); return 'good';
    }

    // Generic threshold-driven rep (hysteresis + extreme tracking + form evidence).
    function runRep(o) {
      const below = o.activeWhenBelow, m = o.metric;
      if (R.stage === 'active') repFrame(o.formEvaluable, o.formBad, m, below ? 'min' : 'max');
      const entering = below ? (m < o.enter) : (m > o.enter);
      const exiting  = below ? (m > o.exit)  : (m < o.exit);
      if (R.stage === 'ready' && entering && o.canStart !== false) repStart(o.onActive);
      else if (R.stage === 'active' && exiting) repFinish({
        debounceMs: o.debounceMs, minActiveFrames: o.minActiveFrames, minEvalFrames: o.minEvalFrames,
        badRatio: o.badRatio, target: o.target, track: below ? 'min' : 'max',
        incompleteMsg: o.incompleteMsg, formMsg: o.formMsg,
      });
    }

    function sayActive(text) { statusEl.textContent = text; statusEl.style.color = '#5DCAA5'; }

    /* =========================================================================
       DEADLIFT ML SUBSYSTEM (built here — the file previously had none).
       Rules/ML/hybrid with a SAFETY GATE: ML only influences hybrid mode when the
       stored model metadata has validated===true. Default is validated:false, so an
       unvalidated experimental model never silently affects production decisions.
       ========================================================================= */
    const DL_ROWS_KEY = 'vf_dl_rows_v3';   // v3: rules-based 9-feature vector (spine experiment removed)
    const DL_MODEL_KEY = 'vf_dl_model_v3';
    let dlRows = [];
    let dlModel = null;

    try { dlRows = JSON.parse(localStorage.getItem(DL_ROWS_KEY) || '[]') || []; } catch (e) { dlRows = []; }
    try { dlModel = JSON.parse(localStorage.getItem(DL_MODEL_KEY) || 'null'); } catch (e) { dlModel = null; }

    function mlAllowedNow() {
      if (exercise !== 'deadlift') return false;
      if (DLMODE === 'ml') return true;
      if (DLMODE === 'hybrid') return !!(dlModel && dlModel.meta && dlModel.meta.validated === true);
      return false; // rules mode -> never
    }

    // --- tiny ML math ---
    function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
    function standParams(X) {
      const d = X[0].length, n = X.length, mean = new Array(d).fill(0), std = new Array(d).fill(0);
      for (const r of X) for (let j = 0; j < d; j++) mean[j] += r[j];
      for (let j = 0; j < d; j++) mean[j] /= n;
      for (const r of X) for (let j = 0; j < d; j++) std[j] += (r[j] - mean[j]) ** 2;
      for (let j = 0; j < d; j++) { std[j] = Math.sqrt(std[j] / n) || 1; }
      return { mean, std };
    }
    function stand(r, mean, std) { return r.map((v, j) => (v - mean[j]) / std[j]); }
    function dist(a, b) { let s = 0; for (let j = 0; j < a.length; j++) s += (a[j] - b[j]) ** 2; return Math.sqrt(s); }

    function trainLR(X, y, iters, lr, l2) {
      iters = iters || 300; lr = lr || 0.1; l2 = l2 === undefined ? 0.001 : l2;
      const n = X.length, d = X[0].length; let w = new Array(d).fill(0), b = 0;
      for (let it = 0; it < iters; it++) {
        const gw = new Array(d).fill(0); let gb = 0;
        for (let i = 0; i < n; i++) {
          let z = b; for (let j = 0; j < d; j++) z += w[j] * X[i][j];
          const p = 1 / (1 + Math.exp(-z)), e = p - y[i];
          for (let j = 0; j < d; j++) gw[j] += e * X[i][j];
          gb += e;
        }
        for (let j = 0; j < d; j++) w[j] -= lr * (gw[j] / n + l2 * w[j]);
        b -= lr * gb / n;
      }
      return { w, b };
    }
    function predLR(m, x) { let z = m.b; for (let j = 0; j < x.length; j++) z += m.w[j] * x[j]; return 1 / (1 + Math.exp(-z)); }
    function predKNN(rows, x, k) {
      k = k || 5;
      const ds = rows.map(r => ({ d: dist(r.x, x), y: r.y })).sort((a, b) => a.d - b.d).slice(0, Math.min(k, rows.length));
      return ds.length ? ds.reduce((s, o) => s + o.y, 0) / ds.length : 0.5;
    }
    function gini(y) { if (!y.length) return 0; const p = y.reduce((a, b) => a + b, 0) / y.length; return 1 - p * p - (1 - p) * (1 - p); }
    function buildTree(X, y, depth, maxDepth, minSamples, featSubset) {
      const p = y.length ? y.reduce((a, b) => a + b, 0) / y.length : 0.5;
      if (depth >= maxDepth || y.length < minSamples || gini(y) === 0) return { leaf: true, p };
      const d = X[0].length, feats = featSubset || [...Array(d).keys()];
      let best = null;
      for (const j of feats) {
        const vals = [...new Set(X.map(r => r[j]))].sort((a, b) => a - b);
        for (let t = 0; t < vals.length - 1; t++) {
          const thr = (vals[t] + vals[t + 1]) / 2, li = [], ri = [];
          for (let i = 0; i < X.length; i++) (X[i][j] <= thr ? li : ri).push(i);
          if (!li.length || !ri.length) continue;
          const ly = li.map(i => y[i]), ry = ri.map(i => y[i]);
          const g = (ly.length * gini(ly) + ry.length * gini(ry)) / y.length;
          if (!best || g < best.g) best = { g, j, thr, li, ri };
        }
      }
      if (!best) return { leaf: true, p };
      return {
        leaf: false, j: best.j, thr: best.thr,
        left: buildTree(best.li.map(i => X[i]), best.li.map(i => y[i]), depth + 1, maxDepth, minSamples, featSubset),
        right: buildTree(best.ri.map(i => X[i]), best.ri.map(i => y[i]), depth + 1, maxDepth, minSamples, featSubset),
      };
    }
    function predTree(t, x) { while (!t.leaf) t = (x[t.j] <= t.thr ? t.left : t.right); return t.p; }
    function trainRF(X, y, nTrees, maxDepth) {
      nTrees = nTrees || 15; maxDepth = maxDepth || 4;
      const d = X[0].length, mtry = Math.max(1, Math.round(Math.sqrt(d))), trees = [];
      for (let t = 0; t < nTrees; t++) {
        const bx = [], by = [];
        for (let i = 0; i < X.length; i++) { const r = Math.floor(Math.random() * X.length); bx.push(X[r]); by.push(y[r]); }
        const feats = shuffle([...Array(d).keys()]).slice(0, mtry);
        trees.push(buildTree(bx, by, 0, maxDepth, 3, feats));
      }
      return trees;
    }
    function predRF(trees, x) { return trees.reduce((s, t) => s + predTree(t, x), 0) / trees.length; }

    // Leave-One-PERSON-Out cross-validation (person-grouped). Returns per-classifier accuracy.
    function lopoCV(X, y, persons) {
      const uniq = [...new Set(persons)];
      if (uniq.length < 2) return { note: 'need >=2 persons for person-grouped validation' };
      const correct = { lr: 0, dt: 0, rf: 0, knn: 0, ensemble: 0 }; let total = 0;
      for (const pz of uniq) {
        const triX = [], triY = [], teX = [], teY = [];
        for (let i = 0; i < X.length; i++) {
          if (persons[i] === pz) { teX.push(X[i]); teY.push(y[i]); } else { triX.push(X[i]); triY.push(y[i]); }
        }
        if (!teX.length || !triX.length || new Set(triY).size < 2) continue;
        const { mean, std } = standParams(triX);
        const trs = triX.map(r => stand(r, mean, std)), tes = teX.map(r => stand(r, mean, std));
        const lr = trainLR(trs, triY), forest = trainRF(trs, triY), tree = buildTree(trs, triY, 0, 4, 3, null);
        const knn = trs.map((x, i) => ({ x, y: triY[i] }));
        for (let i = 0; i < tes.length; i++) {
          const x = tes[i];
          const pl = predLR(lr, x), pd = predTree(tree, x), pr = predRF(forest, x), pk = predKNN(knn, x);
          const pe = (pl + pd + pr + pk) / 4;
          if ((pl >= 0.5 ? 1 : 0) === teY[i]) correct.lr++;
          if ((pd >= 0.5 ? 1 : 0) === teY[i]) correct.dt++;
          if ((pr >= 0.5 ? 1 : 0) === teY[i]) correct.rf++;
          if ((pk >= 0.5 ? 1 : 0) === teY[i]) correct.knn++;
          if ((pe >= 0.5 ? 1 : 0) === teY[i]) correct.ensemble++;
          total++;
        }
      }
      if (!total) return { note: 'insufficient data across persons' };
      return {
        lr: +(correct.lr / total).toFixed(3), dt: +(correct.dt / total).toFixed(3),
        rf: +(correct.rf / total).toFixed(3), knn: +(correct.knn / total).toFixed(3),
        ensemble: +(correct.ensemble / total).toFixed(3), n: total,
      };
    }

    function trainDeadlift() {
      if (dlRows.length < 6) { send({ type: 'dl_model', meta: { error: 'need >= 6 recorded reps', nRows: dlRows.length } }); return null; }
      // Train on a single consistent feature length (point 9): use the most recent length, drop mismatches.
      const L = dlRows[dlRows.length - 1].f.length;
      const rows = dlRows.filter(r => r.f && r.f.length === L);
      if (rows.length < 6) { send({ type: 'dl_model', meta: { error: 'need >= 6 reps at the current feature length', nRows: rows.length, featLen: L } }); return null; }
      const X = rows.map(r => r.f), y = rows.map(r => r.label), persons = rows.map(r => r.person);
      const { mean, std } = standParams(X);
      const Xs = X.map(r => stand(r, mean, std));
      const lr = trainLR(Xs, y), forest = trainRF(Xs, y), tree = buildTree(Xs, y, 0, 4, 3, null);
      const knnRows = Xs.map((x, i) => ({ x, y: y[i] }));
      const accuracy = lopoCV(X, y, persons);
      dlModel = {
        mean, std, lr, forest, tree, knnRows,
        // validated stays FALSE until a real evaluation justifies flipping it (see window.__dlValidate).
        meta: { trained: true, validated: false, nRows: X.length, featLen: L, nPersons: new Set(persons).size, accuracy, createdAt: Date.now(), variant: DLVAR },
      };
      try { localStorage.setItem(DL_MODEL_KEY, JSON.stringify(dlModel)); } catch (e) {}
      send({ type: 'dl_model', meta: dlModel.meta });
      return dlModel.meta;
    }
    // Returns P(form == good) in [0,1], or null if no model, or if the feature length doesn't match
    // the model's (point 9: only use the model when the vector length matches what it was trained on).
    function dlPredictGood(f) {
      if (!dlModel) return null;
      if (!dlModel.mean || dlModel.mean.length !== f.length) return null;
      const x = stand(f, dlModel.mean, dlModel.std);
      return (predLR(dlModel.lr, x) + predTree(dlModel.tree, x) + predRF(dlModel.forest, x) + predKNN(dlModel.knnRows, x)) / 4;
    }
    function dlRecord(f, label) {
      dlRows.push({ f, label, sev: DL_SEV, person: DL_PERSON, t: Date.now(), variant: DLVAR });
      try { localStorage.setItem(DL_ROWS_KEY, JSON.stringify(dlRows)); } catch (e) {}
      send({ type: 'dl_rows', count: dlRows.length, person: DL_PERSON, label, sev: DL_SEV });
    }

    /* =========================================================================
       DEADLIFT FEATURE / RULE CONFIG per variant.
       Thresholds are engineering heuristics, NOT validated biomechanical constants.
       ========================================================================= */
    // CONVENTIONAL DEADLIFT is the default. A valid bottom needs a COMBINATION — meaningful
    // KNEE flexion AND HIP hinge AND forward TORSO AND LOWERED hips — never a single angle.
    // That combination is what separates a conventional deadlift from an RDL (knees barely
    // bend, hips stay high) and from a squat (knees bend but the torso stays upright). All
    // angles are degrees from the shoulder/hip/knee/ankle landmarks; they are calibration
    // TARGETS with tolerance, evaluated TOGETHER, not exact rules.
    //   hipBottomMax   hip angle (shoulder-hip-knee) must CLOSE to <= this   (conv ~60-100, tol 110)
    //   kneeMode       'bend'  => knees MUST flex (conventional/sumo);  'straight' => stay straight (RDL)
    //   kneeBottomMax  with 'bend', knee angle (hip-knee-ankle) must reach <= this (conv ~90-125 -> 130)
    //   kneeTooBent    with 'straight', knee below this = too bent for an RDL
    //   torsoLeanMin   trunk must incline at least this from vertical       (conv ~25-55)
    //   squatLeanMax   knees bent deep but trunk more upright than this = a squat, not a deadlift
    //   hipDropMax     (ankle.y - hip.y) / leg-length must fall to <= this  (hips actually lowered)
    // NOTE on lockout/exit: a rep only FINISHES when the back straightens back above `exitBack`, so
    // exitBack must be reachable at a real standing lockout. On camera a good lockout often reads
    // ~158-160° (slight forward head/torso, lens angle), so exitBack 162 left reps stuck "active" and
    // never counted. exitBack is 158 and lockoutBack 152 so a genuine lockout actually closes the rep.
    const DL_CFG = {
      // torsoLeanMin/squatLeanMax raised: a deadlift's torso is strongly inclined at the bottom
      // (~45-75° from vertical); a squat stays far more upright (~20-35°). Requiring a big forward
      // lean is what stops a (forward-leaning) SQUAT from being counted as a deadlift.
      // minTorsoShinSep: at the deepest point the torso must lean at least this many deg MORE than the
      // shins. A SQUAT keeps torso and shins ~parallel (small separation) even when it leans forward a
      // lot; a DEADLIFT pushes the hips back so the torso leans far more than the near-vertical shins.
      // This rejects a deep, forward-leaning squat that clears squatLeanMax on torso lean alone.
      standard: { enterBack: 148, exitBack: 158, hipBottomMax: 115, kneeMode: 'bend',     kneeBottomMax: 142, torsoLeanMin: 38, squatLeanMax: 38, minTorsoShinSep: 22, hipDropMax: 0.92, lockoutBack: 152, lockoutKnee: 145 },
      sumo:     { enterBack: 148, exitBack: 158, hipBottomMax: 118, kneeMode: 'bend',     kneeBottomMax: 142, torsoLeanMin: 32, squatLeanMax: 32, minTorsoShinSep: 15, hipDropMax: 0.93, lockoutBack: 152, lockoutKnee: 145 },
      // RDL / stiff-leg (opt-in via ?dlvar=rdl): knees stay mostly straight; deep knee bend is the fault.
      rdl:      { enterBack: 148, exitBack: 158, hipBottomMax: 120, kneeMode: 'straight', kneeTooBent: 120,   torsoLeanMin: 30, squatLeanMax: 0,  minTorsoShinSep: 0,  hipDropMax: 0.95, lockoutBack: 152, lockoutKnee: 0   },
    };
    const DLC = DL_CFG[DLVAR] || DL_CFG.standard;

    const HIP_RISE_THR = 2.0;   // hips rising this many x faster than chest (heuristic, temporally confirmed)

    /* =========================================================================
       DEADLIFT BACK-FORM (v2) — INDIRECT proxy for a rounded back.
       SCOPE NOTE: MediaPipe has NO spine landmarks. This cannot measure spinal
       curvature; it detects a "possible rounded back" from two proxies, judged
       against the user's OWN calibrated standing baseline:
         (A) ear/head -> shoulder -> hip angle DROP vs baseline (neck/upper-trunk).
         (B) shoulder -> hip length / standing baseline (trunk shortening).
       A pure forward hinge keeps both near baseline, so forward lean alone is
       NEVER flagged. A fault needs either signal sustained; both agreeing = higher
       confidence. This is a form aid, not medical analysis.
       ---- NEW TUNABLE CONSTANTS (defaults) ---- :
         BACK_ROUND_DEV   25   deg drop in ear-shoulder-hip vs baseline = suspect
         BACK_SHRINK_MIN  0.90 shoulder-hip length / baseline below this = suspect
         BACK_PERSIST_MS  250  live: sustained suspicion before RED
         BACK_RUN_MS      300  rep-level: any sustained suspect run this long fails the rep
         BACK_EMA_ALPHA   0.5  light smoothing of the back signals
         CALIB_MIN_FRAMES 8    standing frames needed before baselines are trusted
         CALIB_MIN_VIS    0.6  landmark visibility required to use a calibration frame
         HEAD_MIN_VIS     0.5  head-point (ear/nose) visibility required to trust it
         FRONT_FACING_MAX 1.0  shoulderWidth/torso above this = too front-on to judge
         LEAN_BACK_DEG    18   trunk-from-vertical AWAY from facing at lockout = lean-back
         LEAN_BACK_MS     250  sustained lean-back time before flagging
         TOO_FAR_TORSO_PX 70   torso shorter than this on screen = "move closer"
         LOW_FPS          12   below this fps = "low frame rate"
       ========================================================================= */
    // Defaults 25 / 0.90. Tunable LIVE from the URL for per-body/per-camera calibration:
    //   ?rounddev=<deg>   lower = flags neck/upper-back rounding sooner
    //   ?shrinkmin=<0..1> HIGHER (e.g. 0.95) = flags mid-back rounding (torso shortening) sooner
    // (These override the default only; they do not change any other behaviour.)
    const BACK_ROUND_DEV   = (function () { const v = parseFloat(params.get('rounddev'));  return (isFinite(v) && v > 0) ? v : 25; })();
    // Default raised 0.90 -> 0.93 from real data: a rounded back measured SHRmin 0.91 while standing was
    // ~0.97, so 0.93 catches the rounding with margin. Tune per body/camera with ?shrinkmin=.
    const BACK_SHRINK_MIN  = (function () { const v = parseFloat(params.get('shrinkmin')); return (isFinite(v) && v > 0 && v < 1.2) ? v : 0.93; })();
    const BACK_PERSIST_MS  = 250;
    const BACK_RUN_MS      = 300;
    // HIGH-CONFIDENCE rounding: a rep is only FAILED for a rounded back when BOTH proxies (ear-angle
    // drop AND torso-shortening) agree for a run this long. Both-signal + longer dwell keeps a normal
    // head-down pull from false-failing, while still catching an obviously rounded back. Also drives
    // the live RED border, so the border and the rep decision agree.
    const BACK_BOTH_MS     = 400;
    // Hips shooting up faster than the chest (stiff-legging the pull) FAILS the rep at/above this ratio.
    const HIP_SHOOT_FAIL   = 2.5;
    const BACK_EMA_ALPHA   = 0.5;
    const CALIB_MIN_FRAMES = 8;
    const CALIB_MIN_VIS    = 0.6;
    const HEAD_MIN_VIS     = 0.5;
    const FRONT_FACING_MAX = 1.0;
    const LEAN_BACK_DEG    = 18;
    const LEAN_BACK_MS     = 250;
    const TOO_FAR_TORSO_PX = 70;
    const LOW_FPS          = 12;
    const MIN_EVAL_COVERAGE = 0.5;  // fraction of a rep's frames that must be judgeable to trust a back verdict
    // Gap tolerance for a sustained rounding RUN. The proxy value must bridge the EMA LAG: one dropout
    // frame pushes the smoothed ear/shrink signals sub-threshold for ~2 frames, so ~1 frame (1.6x) is
    // not enough. 3x (~150ms at 20fps, well under BACK_RUN_MS) bridges realistic flicker. This is SAFE:
    // the gap only EXTENDS an existing run (never starts one), and a lone suspect frame never accumulates
    // runMax — so neutral/jitter reps (zero suspect frames) can't be turned into false BADs.
    const ROUND_GAP_PROXY = 3.0;    // x measured MediaPipe frame interval

    // ---- ANTI-FALSE-COUNT (a rep must be a real stand -> deep hinge -> stand, not random bending) ----
    const STAND_TALL_BACK  = 150;   // must straighten to at least this (shoulder-hip-knee) to ARM the next rep
    const STAND_TALL_KNEE  = 125;   // ...and knees roughly straight. Lowered from 140: on camera a real lockout knee often reads below 140 (foreshortening), so re-arming silently stopped after a few reps. Kept BELOW exitBack (158) so finishing a rep (back>158) also re-arms the next one; the hinge still must reach enterBack (148) to start a rep, so false counts are still prevented.
    const HINGE_ATTEMPT_BACK = 135; // a rep must hinge at least this deep to count at all; shallower = ignored (no rep)
    // Deadlift = hip-hinge (torso leans FORWARD a lot); squat = knee-dominant (torso stays upright).
    // Require clear forward trunk lean so an upright squat isn't counted as a deadlift. STRICT:
    // a real deadlift leans ~50-70deg, a squat ~10-25deg, so 40 rejects squats firmly while real
    // deadlifts still clear it. (Lower toward 30 if it ever skips your reps.)
    const DEADLIFT_MIN_LEAN = 40;   // deg of peak trunk-from-vertical lean required to count as a deadlift


    let dlRoundSince = 0;   // timestamp the current sustained back-round suspicion began (0 = none)
    let dlRoundLast = 0;    // last frame the suspicion was true (for one-missed-sample tolerance)
    let dlBothSince = 0;    // timestamp the current sustained HIGH-CONFIDENCE (both proxies agree) rounding began
    let dlBothLast = 0;     // last frame both agreed (one-missed-sample tolerance)
    let dlLeanSince = 0;    // timestamp the current sustained lean-back began (0 = none)
    let dlArmed = false;    // a rep can only start after the user has stood tall (prevents flailing counting)
    let dlQualityReasons = []; // current tracking-quality issues (for the chip)

    // Personal calibration baselines (captured standing upright during the countdown + between reps).
    // PER-HEAD-SOURCE ear baselines (fix): ear vs nose give different ear->shoulder->hip angles, so the
    // delta must be measured against a baseline for the SAME source used this frame.
    let dlBase = { shoulderHip: 0, facingSign: 0, n: 0, ear: { ear: { v: 0, n: 0 }, ear2: { v: 0, n: 0 }, nose: { v: 0, n: 0 } } };
    function dlBaseReady() { return dlBase.n >= CALIB_MIN_FRAMES; }
    function headBaseReady(src) { return !!(src && dlBase.ear[src] && dlBase.ear[src].n >= 3); }

    // Pick the most reliable head point: near-side ear -> far-side ear -> nose.
    function bestHead(keypoints, S) {
      const near = kpRaw(keypoints, S + '_ear');
      if (near && (near.score ?? 1) >= HEAD_MIN_VIS) return { pt: near, src: 'ear' };
      const far = kpRaw(keypoints, (S === 'left' ? 'right' : 'left') + '_ear');
      if (far && (far.score ?? 1) >= HEAD_MIN_VIS) return { pt: far, src: 'ear2' };
      const nose = kpRaw(keypoints, 'nose');
      if (nose && (nose.score ?? 1) >= HEAD_MIN_VIS) return { pt: nose, src: 'nose' };
      return null;
    }

    // Capture baselines from clearly-upright, good-visibility frames (ignores noisy/low-vis frames).
    function dlCalibrate(keypoints) {
      const S = pickSide(keypoints, ['shoulder', 'hip', 'knee']);
      const sh = kpRaw(keypoints, S + '_shoulder'), hip = kpRaw(keypoints, S + '_hip'), knee = kpRaw(keypoints, S + '_knee');
      if (!(sh && hip && knee)) return;
      if ((sh.score ?? 1) < CALIB_MIN_VIS || (hip.score ?? 1) < CALIB_MIN_VIS || (knee.score ?? 1) < CALIB_MIN_VIS) return;
      if (ang(sh, hip, knee) < 150) return;        // must be roughly upright
      const head = bestHead(keypoints, S), nose = kpRaw(keypoints, 'nose');
      const a = 1 / Math.min(dlBase.n + 1, 20);     // running mean, then light EMA
      if (head) {                                    // per-source ear baseline
        const ea = ang(head.pt, sh, hip), b = dlBase.ear[head.src];
        const aa = 1 / Math.min(b.n + 1, 20);
        b.v = b.n ? b.v * (1 - aa) + ea * aa : ea; b.n++;
      }
      const shl = dist3D(sh, hip); dlBase.shoulderHip = dlBase.shoulderHip ? dlBase.shoulderHip * (1 - a) + shl * a : shl;
      if (nose && (nose.score ?? 1) >= HEAD_MIN_VIS) { const fs = Math.sign(nose.x - sh.x); if (fs) dlBase.facingSign = fs; }
      dlBase.n++;
    }

    // Per-rep aggregation for deadlift (running stats, no per-frame arrays).
    let dlAgg = null;
    let dlPrevHipY = null, dlPrevShoulderY = null;
    let dlBaseTorso = 0; // legacy standing torso baseline (kept for the ML feature vector)

    let dlActiveStart = 0;   // timestamp the active phase began (for the SET-UP reference window)
    let dlFrameDtMs = 50, dlPrevNow = 0;  // measured MediaPipe frame interval (for the proxy gap tolerance)
    let dlLastPeak = { dEAR: 0, shr: 1 };  // last/current rep's peak back-rounding signals (for tuning readout)
    function dlResetAgg() {
      dlAgg = {
        backMin: 999, backMax: -999, kneeMin: 999, kneeMax: -999,
        earMin: 999, leanMax: 0, hipRiseMax: 0, shrinkMin: 1, frontSum: 0, frontN: 0,
        backEvalFrames: 0, runStart: 0, runLast: 0, runMax: 0, leanBackMs: 0, bothAgree: false, frames: 0,
        bothRunStart: 0, bothRunLast: 0, bothRunMax: 0,   // longest sustained run where BOTH rounding proxies agree (high-confidence)
        earDeltaMax: 0,   // per-rep PEAK neck/upper-back drop (for live tuning readout)
        hipDropMin: 1,    // deepest (ankle.y - hip.y)/legLength reached (conventional-deadlift lowering)
        sepAtDeepest: 0,  // torso-minus-shin lean (deg) at the deepest hinge: squat ~small, deadlift ~large
      };
      dlPrevHipY = null; dlPrevShoulderY = null; dlRoundSince = 0; dlRoundLast = 0; dlBothSince = 0; dlBothLast = 0; dlLeanSince = 0;
      dlActiveStart = NOW;
    }

    // ---- Per-FRAME back-posture recorder (dev label mode) for threshold tuning ----
    const DL_FRAME_KEY = 'vf_dl_frames_v3';
    let dlFrameRows = [];
    try { dlFrameRows = JSON.parse(localStorage.getItem(DL_FRAME_KEY) || '[]') || []; } catch (e) { dlFrameRows = []; }
    function dlRecordFrame(f, label, canJudge) {
      dlFrameRows.push({ f, label, sev: DL_SEV, person: DL_PERSON, t: Date.now(), cj: canJudge ? 1 : 0 });
      if (dlFrameRows.length % 10 === 0) dlSaveFrames();
    }
    function dlSaveFrames() { try { localStorage.setItem(DL_FRAME_KEY, JSON.stringify(dlFrameRows)); } catch (e) {} }
    function dlSaveRows() { try { localStorage.setItem(DL_ROWS_KEY, JSON.stringify(dlRows)); } catch (e) {} }
    // 2b.5: never lose the tail of a recording session when the WebView is backgrounded/closed.
    window.addEventListener('pagehide', () => { dlSaveFrames(); dlSaveRows(); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { dlSaveFrames(); dlSaveRows(); } });

    /* =========================================================================
       BICEP CURL — EITHER-ARM, built on two per-arm state machines.
       The left and right arms are tracked as two independent rep state machines
       (curl phase down -> curling -> up -> lowering, elbow angle, deepest-curl
       extreme, per-rep form evidence, debounce, gap-reset). Each arm counts on its
       OWN via the shared per-limb finishLimb() with NO pairing (either-arm), the same
       as high knees / side leg raise: each arm counts the instant it completes its own
       curl, so a both-arm curl counts 2 (one per arm). This also means a front-facing
       curl, where the two arms don't finish cleanly together, counts reliably instead
       of leaving one arm waiting for a partner. This
       bypasses the single-track global R engine on purpose (R is one state machine;
       bicep needs two) while reusing the shared rep()/badRep()/setForm() plumbing so
       counting, the AR border and the verdict flash behave exactly like every other
       exercise.
       ========================================================================= */
    const CURL = {
      enter: 100,        // elbow angle (shoulder-elbow-wrist) below this => arm is curling (active).
                         // 100 (was 110) = only a clear bend starts a curl; keeps hysteresis vs exit 150.
      exit: 150,         // elbow angle back above this => arm returned to extended; arms/finishes a rep.
                         // 150 (was 140) so a straight FRONT-FACING arm, which reads ~145-150° with EMA
                         // lag, reliably clears the armed threshold — otherwise a face-on curl never arms.
      target: 90,        // deepest elbow angle must reach <= this for a COMPLETE curl. 90 (was 80): a
                         // front-on curl's deepest angle reads a bit higher than side-on, so don't fail it.
      swingBadDeg: 45,   // upper-arm swing (hip-shoulder-elbow) above this = unstable elbow / cheating
      maxUpperArm: 95,   // IDENTITY: peak upper-arm elevation (hip-shoulder-elbow). A curl keeps the
                         // elbow fairly DOWN; 95 (was 70) allows the normal elbow drift of a front-on
                         // curl, but still rejects a full overhead raise -> not a bicep curl, no count.
      debounceMs: 300,   // min gap between two reps on the SAME arm
      minActiveFrames: 2,
      pairMs: 1200,      // two completions whose active windows overlapped within this = ONE both-arm rep
                         // (widened from 700 so arms that finish a little apart still pair into one rep)
      maxActiveMs: 6000, // safety: abandon a curl stuck "active" longer than this (never finished)
      bodySwayPx: 60,    // shoulder-line horizontal drift (x bodyScale) above this = body english
    };
    // A live fault (elbow swing / body english) must PERSIST this long before it turns the border red
    // AND before it fails the rep. Like the raise engine's RAISE_FAULT_MS, tying both to the SAME
    // sustained-fault run makes red agree with the count: a fault you saw go red also fails the rep, and
    // a rep that counts never flashed a fault-red. (Replaces the old bad-frame ratio, whose single-frame
    // reds didn't match the ratio gate — so a brief swing showed red yet the rep still counted.)
    const CURL_FAULT_MS = 350;
    function makeCurlArm() {
      return {
        active: false, phase: 'down', activeStart: 0, activeFrames: 0,
        extreme: 180, peakAt: 0, upperArmMax: 0, partialUp: false, bounceUntil: 0,
        faultSince: 0, faultRunMax: 0, faultReason: '', faultReasonSus: '',  // sustained-fault tracking
        lastRepMs: 0, lastSeenMs: 0,
        armed: false,   // a curl may only START after the arm was seen straight (extended) first
        finStart: 0, finEnd: 0, finPeak: 0, finOk: true, finReason: '', finValid: false, finPaired: false,
        pending: false, lastCountMs: 0,   // used by the shared per-limb finishLimb/flushPending
      };
    }
    const curlArms = { left: makeCurlArm(), right: makeCurlArm() };
    function resetCurlArm(a) {
      a.active = false; a.phase = 'down'; a.activeStart = 0; a.activeFrames = 0;
      a.extreme = 180; a.peakAt = 0; a.upperArmMax = 0; a.partialUp = false;
      a.faultSince = 0; a.faultRunMax = 0; a.faultReason = ''; a.faultReasonSus = '';
    }

    // LEGACY both-arms-only rep resolution. Bicep curl, front raise AND lateral raise now count
    // EITHER arm via the shared per-limb finishLimb()/flushPending(), so this path is no longer
    // used by them; it is kept only for the finishRaise else-branch (any raise config WITHOUT
    // mode:'either'). Left in place so a future both-arms-only exercise can reuse it.
    const ARM_PAIR_MS = 1200;       // the other arm must have completed within this of this one (was 700)
    const bothRepLast = {};         // per-exercise debounce (keyed) for a counted both-arm rep
    function recordArmFinish(a, startMs, endMs, ok, reason) {
      a.finStart = startMs; a.finEnd = endMs;
      a.finOk = ok; a.finReason = reason; a.finValid = true; a.finPaired = false;
    }
    function resolveBothArm(arms, side, pairMs, debounceMs, key) {
      const a = arms[side], o = arms[side === 'left' ? 'right' : 'left'];
      const together = o.finValid && !o.finPaired &&
        o.finEnd >= a.finStart && o.finStart <= a.finEnd &&   // active windows overlapped in time
        (a.finEnd - o.finEnd) <= (pairMs || ARM_PAIR_MS);     // and the other arm just completed too
      if (!together) return;                                  // lone / staggered arm -> not a both-arm rep
      o.finPaired = true; a.finPaired = true;                 // consume both halves of the rep
      if (NOW - (bothRepLast[key] || 0) < (debounceMs || 300)) return;   // both-arm debounce
      bothRepLast[key] = NOW;
      if (a.finOk && o.finOk) rep();                          // both arms good -> count once
      else badRep(a.finOk ? o.finReason : (o.finOk ? a.finReason : (a.finReason || o.finReason)));
    }

    // Finish an in-progress curl on `side` (elbow extended again). Computes THIS arm's verdict
    // (deep enough + form) and defers to the shared per-limb finishLimb — each arm counts
    // INDEPENDENTLY, no pairing (either-arm), same as high knees / side leg raise. A both-arm
    // curl therefore counts 2 (one per arm). Face-on, two arms that don't finish cleanly together
    // no longer leave one arm waiting for a partner, so a front-facing curl counts reliably.
    function finishCurl(side) {
      const a = curlArms[side];
      const startMs = a.activeStart;
      a.active = false; a.phase = 'down'; a.partialUp = false;
      if (a.activeFrames < CURL.minActiveFrames) return;      // too short to be a real completion: ignore
      let ok = true, reason = '';
      if (a.extreme > CURL.target) { ok = false; reason = 'Fully curl your ' + side + ' arm'; }
      else if (a.upperArmMax > CURL.maxUpperArm) {            // IDENTITY: the arm was RAISED, not curled
        ok = false; reason = 'Keep your ' + side + ' elbow at your side — curl, don’t raise';
      } else if (a.faultRunMax >= CURL_FAULT_MS) {            // a fault (swing / body english) sustained long enough to show red
        ok = false; reason = a.faultReasonSus || ('Keep your ' + side + ' elbow stable');
      }
      finishLimb(curlArms, side, startMs, ok, reason, { pair: false, debounceMs: CURL.debounceMs });
    }

    // Advance ONE arm's state machine for this frame. `bodySway` is the shared
    // upper-body-english signal (not arm-specific). Returns this arm's live read
    // for the combined border/feedback. Never consults the other arm.
    function updateCurlArm(side, keypoints, bodySway) {
      const a = curlArms[side];
      const sh = kp(keypoints, side + '_shoulder'), el = kp(keypoints, side + '_elbow'), wr = kp(keypoints, side + '_wrist');
      if (!(sh && el && wr)) {                                 // unreliable landmarks -> UNKNOWN for this arm
        if (a.active && a.lastSeenMs && NOW - a.lastSeenMs > POSE_GAP_MS) resetCurlArm(a); // lost mid-rep -> abandon
        return { visible: false };
      }
      a.lastSeenMs = NOW;
      const elbowAngle = smoothV('curl_elbow_' + side, ang(sh, el, wr));
      const hip = kp(keypoints, side + '_hip');
      const swingEvaluable = !!hip;
      const swing = swingEvaluable ? ang(hip, sh, el) : 0;
      const swingBad = swingEvaluable && swing > CURL.swingBadDeg;
      // THIS frame's fault (elbow swing has priority over whole-body english).
      const frameFault = swingBad ? ('Keep your ' + side + ' elbow stable')
                       : (bodySway ? 'Avoid swinging your body' : '');

      const tally = () => {
        if (swingEvaluable && swing > a.upperArmMax) a.upperArmMax = swing;        // peak upper-arm elevation (identity)
        if (elbowAngle < a.extreme) { a.extreme = elbowAngle; a.peakAt = NOW; }  // new deepest curl -> peak time
        // Sustained-fault tracking: the run must persist CURL_FAULT_MS before it shows red / fails the rep.
        if (frameFault) {
          if (!a.faultSince) a.faultSince = NOW;
          const run = NOW - a.faultSince;
          a.faultReason = frameFault;
          if (run >= CURL_FAULT_MS && run >= a.faultRunMax) a.faultReasonSus = frameFault;
          if (run > a.faultRunMax) a.faultRunMax = run;
        } else {
          a.faultSince = 0;
        }
      };

      if (!a.active) {
        if (elbowAngle > CURL.exit) a.armed = true;            // arm was straight -> next curl may start
        if (a.armed && elbowAngle < CURL.enter) {              // DOWN -> start CURLING (only from a straight arm)
          a.armed = false;
          a.active = true; a.phase = 'up'; a.activeStart = NOW; a.activeFrames = 1;
          a.extreme = elbowAngle; a.peakAt = NOW; a.upperArmMax = swingEvaluable ? swing : 0;
          a.faultSince = 0; a.faultRunMax = 0; a.faultReason = ''; a.faultReasonSus = ''; a.partialUp = false;
          tally();
        }
      } else {
        a.activeFrames++;
        tally();
        // Half-rep bounce: started to lower then re-curled without a full return.
        if (elbowAngle > CURL.exit - 15) a.partialUp = true;
        else if (a.partialUp && elbowAngle < CURL.enter) { a.bounceUntil = NOW + 900; a.partialUp = false; }
        if (elbowAngle > CURL.exit) finishCurl(side);          // returned to extended -> finish the rep
        else if (NOW - a.activeStart > CURL.maxActiveMs) resetCurlArm(a); // safety: stuck active
      }
      // faultLive: a fault has now persisted long enough to turn the border red — the SAME signal
      // (faultRunMax) that fails the rep in finishCurl, so red and the count always agree.
      const faultLive = a.active && a.faultSince && (NOW - a.faultSince >= CURL_FAULT_MS);
      return { visible: true, elbowAngle, active: a.active, faultLive, faultReason: a.faultReason };
    }

    /* =========================================================================
       FRONT RAISE & LATERAL RAISE — SHARED INDEPENDENT PER-ARM ENGINE
       Like the bicep engine, the left and right arms are tracked as two fully
       independent rep state machines (elevation angle, movement direction, phase,
       form evidence, debounce, gap-reset). Both exercises count EITHER arm (mode:'either'
       → finishLimb + flushPending): a single arm counts on its own, and two arms that
       START together count as ONE rep. ?arm=left|right restricts to one arm.
       (The OLD single-track lateral raise used one averaged both-arms angle, which
       could not judge the arms independently at all.)

       Reaching shoulder height is NOT enough: the rep only counts if the arm travelled
       in the RIGHT direction, supplied per exercise:
         front raise   -> validDir 'forward'  (lateral/backward raises are rejected)
         lateral raise -> validDir 'lateral'  (forward/backward raises are rejected)

       DIRECTION DETECTION (the hard part — "is this a front or a side raise?"):
         - FACE-ON (the natural view for both raises — you face the mirror/camera): use
           the 2D horizontal spread of the wrist from the shoulder, normalized by torso.
           A front raise keeps the wrist roughly in front (small spread); a side raise
           swings it far out (large spread). This is a plain image measurement and does
           NOT depend on MediaPipe's noisy world-Z depth, so it is reliable here. This is
           what fixes "front raise counts the side too" and "hard to tell front vs side".
         - SIDE-ON (profile): the image spread can't separate forward from sideways, so
           fall back to the view-independent torso-frame world-coordinate projection.
         - Backward is always checked from world-Z when available.
       When no signal is trustworthy the frame's direction is UNKNOWN — not counted as
       evidence; a rep with too few judged frames is ignored (never assumed good/bad).
       ========================================================================= */
    // Shared direction-classification thresholds (geometry, not exercise-specific).
    const DIR = {
      judgeAngle: 45,      // only classify direction once the arm is at least this elevated
      // --- 2D image spread (used FACE-ON; robust, no world-Z) ---
      latSpreadHi: 0.62,   // |wrist.x - shoulder.x| / torso above this => lateral (out to the side)
      faceOnMin: 0.55,     // frontFacingRatio at/above this = face-on -> trust the 2D spread
      // --- torso-frame world-coordinate cosines (used SIDE-ON; view-independent) ---
      sideTol: 1.05,       // |lateral| must exceed forward by this factor to call it lateral
      latMinCos: 0.35,     // need at least this much sideways component to call it lateral
      fwdMinCos: 0.10,     // need at least this much forward component to call it forward
      backCos: 0.35,       // forward cosine below -this (arm points behind the torso) => backward
    };

    // World-frame direction cosines {fwd, lat} of the arm vector in the user's OWN torso frame,
    // oriented so +fwd points toward the face (front of the body). Returns null when world
    // coordinates or the needed landmarks are missing. (Shared by both the side-on path and the
    // face-on backward check.)
    function armTorsoCosines(side, keypoints) {
      const sh = kp(keypoints, side + '_shoulder'), wr = kp(keypoints, side + '_wrist');
      const ls = kpRaw(keypoints, 'left_shoulder'), rs = kpRaw(keypoints, 'right_shoulder');
      const lh = kpRaw(keypoints, 'left_hip'), rh = kpRaw(keypoints, 'right_hip'), nose = kpRaw(keypoints, 'nose');
      const W = p => p && p.wx !== undefined;
      if (!(sh && wr && W(sh) && W(wr) && W(ls) && W(rs) && W(lh) && W(rh))) return null;
      const Lx = rs.wx - ls.wx, Ly = rs.wy - ls.wy, Lz = rs.wz - ls.wz;            // lateral (shoulder line)
      const shCx = (ls.wx + rs.wx) / 2, shCy = (ls.wy + rs.wy) / 2, shCz = (ls.wz + rs.wz) / 2;
      const hpCx = (lh.wx + rh.wx) / 2, hpCy = (lh.wy + rh.wy) / 2, hpCz = (lh.wz + rh.wz) / 2;
      const Ux = shCx - hpCx, Uy = shCy - hpCy, Uz = shCz - hpCz;                  // torso up (hip->shoulder)
      let Fx = Uy * Lz - Uz * Ly, Fy = Uz * Lx - Ux * Lz, Fz = Ux * Ly - Uy * Lx; // forward = U x L
      const nL = Math.hypot(Lx, Ly, Lz), nF = Math.hypot(Fx, Fy, Fz);
      if (nL <= 1e-4 || nF <= 1e-4) return null;
      if (W(nose)) {   // orient forward toward the face; else default to camera (-z)
        const d = Fx * (nose.wx - hpCx) + Fy * (nose.wy - hpCy) + Fz * (nose.wz - hpCz);
        if (d < 0) { Fx = -Fx; Fy = -Fy; Fz = -Fz; }
      } else if (Fz > 0) { Fx = -Fx; Fy = -Fy; Fz = -Fz; }
      const ax = wr.wx - sh.wx, ay = wr.wy - sh.wy, az = wr.wz - sh.wz;
      const nA = Math.hypot(ax, ay, az);
      if (nA <= 1e-4) return null;
      return {
        fwd: (ax * Fx + ay * Fy + az * Fz) / (nF * nA),   // arm cosine toward FRONT of the body
        lat: (ax * Lx + ay * Ly + az * Lz) / (nL * nA),   // ...along the shoulder line (SIDE)
      };
    }

    // Classify ONE arm's raise direction this frame: 'forward' | 'lateral' | 'backward' | 'unknown'.
    // Caller only trusts this while the arm is elevated (armAngle > DIR.judgeAngle).
    function raiseDirection(side, keypoints) {
      const sh = kp(keypoints, side + '_shoulder'), wr = kp(keypoints, side + '_wrist');
      if (!(sh && wr)) return 'unknown';
      const cos = armTorsoCosines(side, keypoints);
      const faceOn = frontFacingRatio(keypoints) >= DIR.faceOnMin;

      // FACE-ON: trust the 2D spread (reliable, no depth). Backward still uses world-Z when present.
      if (faceOn) {
        if (cos && cos.fwd < -DIR.backCos) return 'backward';
        const hipPx = kpRaw(keypoints, side + '_hip');
        const scale = torsoPx > 0 ? torsoPx : (hipPx ? Math.hypot(sh.x - hipPx.x, sh.y - hipPx.y) : 0);
        if (!scale || scale <= 1) return cos ? worldDir(cos) : 'unknown';
        return (Math.abs(wr.x - sh.x) / scale > DIR.latSpreadHi) ? 'lateral' : 'forward';
      }

      // SIDE-ON (or unknown orientation): the image spread is ambiguous, so use the torso frame.
      return cos ? worldDir(cos) : 'unknown';
    }
    // Decide direction from torso-frame cosines (side-on path / face-on fallback).
    function worldDir(cos) {
      const fwd = cos.fwd, lat = cos.lat;
      if (fwd < -DIR.backCos) return 'backward';
      if (Math.abs(lat) > Math.max(fwd, 0) * DIR.sideTol && Math.abs(lat) > DIR.latMinCos) return 'lateral';
      if (fwd > DIR.fwdMinCos) return 'forward';
      return 'unknown';
    }

    // Per-arm raise configs. up/down = raise/lower hysteresis on elevation (hip-shoulder-wrist);
    // target = peak that must be reached; elbowBentMax = elbow-bend fault (0 disables); tooHighMax =
    // "above shoulder" fault (0 disables); validDir = the only direction that counts.
    // IDENTITY: a raise is a STRAIGHT-ARM lift of the WHOLE arm, so `elbowBentMax` (elbow must stay
    // fairly straight) and `minUpperArm` (the upper arm / elbow must actually rise, hip-shoulder-elbow
    // peak >= this) together reject a bicep curl — where the elbow stays down and only the forearm
    // swings up, which otherwise inflates the hip-shoulder-wrist elevation and looks like a raise.
    // A live fault must PERSIST this long before it turns the border red AND before it fails the rep.
    // Tying both to the same sustained-fault signal makes red agree with the count: if you saw red
    // caused by the rep, the rep is not counted; if the rep counts, you did not see a fault-red.
    // It also absorbs single-frame misclassifications (e.g. a stray 'backward' from world-Z noise),
    // so a correct raise is no longer briefly flagged.
    const RAISE_FAULT_MS = 350;
    const FRONT = {
      key: 'fr', validDir: 'forward', up: 50, down: 28, target: 65,
      elbowBentMax: 130, tooHighMax: 0, minUpperArm: 45,   // elbowBentMax 150->130: don't flag a normal soft elbow
      minDirFrames: 3,
      debounceMs: 300, minActiveFrames: 2,
      maxActiveMs: 6000, bodySwayPx: 55, pairMs: ARM_PAIR_MS,
      // EITHER-arm counting (per-limb engine): one arm counts alone; two arms that start together
      // pair into ONE rep. finishRaise routes mode:'either' to finishLimb.
      mode: 'either',
    };
    const LAT = {
      key: 'lr', validDir: 'lateral', up: 50, down: 28, target: 70,
      elbowBentMax: 130, tooHighMax: 115, minUpperArm: 45,
      minDirFrames: 3,
      debounceMs: 300, minActiveFrames: 2,
      maxActiveMs: 6000, bodySwayPx: 55, pairMs: ARM_PAIR_MS,
      // EITHER-ARM counting (per-limb engine): counts on whichever arm raises. Two arms
      // that start together pair into ONE rep; a lone arm counts via flushPending(latArms).
      mode: 'either',
    };
    function makeRaiseArm() {
      return {
        active: false, phase: 'down', activeStart: 0, activeFrames: 0,
        extreme: 0,                               // max elevation angle reached this rep
        upperArmMax: 0, upperArmSeen: false,      // peak upper-arm (hip-shoulder-elbow) elevation (identity)
        dirJudged: 0,                             // frames where direction was judgeable (verifiability gate)
        faultSince: 0, faultRunMax: 0, faultReason: '', faultReasonSus: '',  // sustained-fault tracking
        partialDown: false, bounceUntil: 0,
        lastRepMs: 0, lastSeenMs: 0,
        finStart: 0, finEnd: 0, finOk: true, finReason: '', finValid: false, finPaired: false,
        pending: false, lastCountMs: 0,   // used by the shared per-limb finishLimb/flushPending (front + lateral raise)
      };
    }
    const fraiseArms = { left: makeRaiseArm(), right: makeRaiseArm() };   // front raise
    const latArms    = { left: makeRaiseArm(), right: makeRaiseArm() };   // lateral raise
    function resetRaiseArm(a) {
      a.active = false; a.phase = 'down'; a.activeStart = 0; a.activeFrames = 0; a.extreme = 0;
      a.upperArmMax = 0; a.upperArmSeen = false; a.dirJudged = 0;
      a.faultSince = 0; a.faultRunMax = 0; a.faultReason = ''; a.faultReasonSus = ''; a.partialDown = false;
      a.pending = false;
    }

    // Live per-frame message for a wrong-direction frame (dir is THIS frame's wrong direction).
    function dirFaultMsg(dir, C, side) {
      if (C.validDir === 'forward') {
        return dir === 'lateral' ? 'Raise your ' + side + ' arm forward, not sideways'
                                 : "Don't move your " + side + ' arm backward';
      }
      return dir === 'forward' ? 'Raise your ' + side + ' arm out to the side, not forward'
                               : "Don't swing your " + side + ' arm backward';
    }

    // Finish an in-progress raise on `side`. A config with mode:'either' (front + lateral raise)
    // goes through finishLimb — EITHER arm counts, and two arms that start together count as ONE
    // rep; the resolveBothArm branch below is only for a config WITHOUT mode:'either'. Rejections,
    // in order:
    //   incomplete elevation (didn't reach shoulder height) -> curl-not-raise identity ->
    //   direction unverifiable (ignore) -> a SUSTAINED fault (same signal that turned the border red).
    // Using the sustained-fault run (not a frame ratio) makes red agree with the count: any fault that
    // lasted long enough to show red during the rep also fails the rep, and a rep that counts never
    // showed a fault-red.
    function finishRaise(side, arms, C) {
      const a = arms[side];
      const startMs = a.activeStart, endMs = NOW;
      a.active = false; a.phase = 'down'; a.partialDown = false;
      if (a.activeFrames < C.minActiveFrames) return;         // too short to be a real completion: ignore
      let ok = true, reason = '';
      if (a.extreme < C.target) { ok = false; reason = 'Raise your ' + side + ' arm to shoulder height'; }
      else if (a.upperArmSeen && a.upperArmMax < C.minUpperArm) {   // IDENTITY: only the forearm moved
        ok = false; reason = 'Raise your whole ' + side + ' arm straight — that looks like a curl';
      } else if (a.dirJudged < C.minDirFrames) { return; }    // direction UNKNOWN -> can't verify -> ignore this arm
      else if (a.faultRunMax >= RAISE_FAULT_MS) {             // a fault was sustained long enough to show red
        ok = false; reason = a.faultReasonSus || 'Fix your ' + side + ' arm form';
      }
      if (C.mode === 'either') {
        // front + lateral raise: per-limb engine — pairs two arms that started together into ONE
        // rep, else counts a single arm alone (via flushPending). Partner verdict is honoured.
        finishLimb(arms, side, startMs, ok, reason, { pair: true, debounceMs: C.debounceMs });
      } else {
        recordArmFinish(a, startMs, endMs, ok, reason);
        resolveBothArm(arms, side, C.pairMs, C.debounceMs, C.key);   // legacy both-arms-only path (unused: front + lateral raise use mode:'either')
      }
    }

    // Advance ONE arm's raise state machine for this frame. `bodySway` is the shared torso-swing
    // signal. Returns this arm's live read, including whether a fault has been SUSTAINED (faultLive).
    function updateRaiseArm(side, arms, keypoints, bodySway, C) {
      const a = arms[side];
      const sh = kp(keypoints, side + '_shoulder'), wr = kp(keypoints, side + '_wrist'), hip = kp(keypoints, side + '_hip');
      if (!(sh && wr && hip)) {                               // need shoulder+wrist+hip to measure elevation
        if (a.active && a.lastSeenMs && NOW - a.lastSeenMs > POSE_GAP_MS) resetRaiseArm(a);
        return { visible: false };
      }
      a.lastSeenMs = NOW;
      const armAngle = smoothV(C.key + '_arm_' + side, ang(hip, sh, wr));
      const el = kp(keypoints, side + '_elbow');
      const elbowAngle = el ? ang(sh, el, wr) : 180;
      const elbowBad = C.elbowBentMax ? (!!el && armAngle > DIR.judgeAngle && elbowAngle < C.elbowBentMax) : false;
      const tooHigh = C.tooHighMax ? armAngle > C.tooHighMax : false;
      // IDENTITY: elevation of the UPPER ARM itself (hip-shoulder-elbow). In a raise the elbow rises
      // with the arm; in a curl the elbow stays down and only the forearm swings up.
      const upperArm = el ? ang(hip, sh, el) : null;
      const dir = armAngle > DIR.judgeAngle ? raiseDirection(side, keypoints) : 'unknown';
      const dirBad = dir !== 'unknown' && dir !== C.validDir;

      // THIS frame's fault (priority: wrong direction -> elbow too bent -> too high -> torso sway).
      const frameFault = dirBad ? dirFaultMsg(dir, C, side)
                       : elbowBad ? 'Keep your ' + side + ' elbow straighter'
                       : tooHigh ? "Don't raise your " + side + ' arm above shoulder height'
                       : (bodySway ? 'Avoid swinging your torso' : '');

      const tally = () => {
        if (upperArm !== null) { a.upperArmSeen = true; if (upperArm > a.upperArmMax) a.upperArmMax = upperArm; }
        if (dir !== 'unknown') a.dirJudged++;
        // Sustained-fault tracking: the run must persist RAISE_FAULT_MS before it shows red / fails the rep.
        if (frameFault) {
          if (!a.faultSince) a.faultSince = NOW;
          const run = NOW - a.faultSince;
          a.faultReason = frameFault;
          if (run >= RAISE_FAULT_MS && run >= a.faultRunMax) a.faultReasonSus = frameFault;
          if (run > a.faultRunMax) a.faultRunMax = run;
        } else {
          a.faultSince = 0;
        }
      };

      if (!a.active) {
        if (armAngle > C.up) {                                // DOWN -> start RAISING
          a.active = true; a.phase = 'up'; a.activeStart = NOW; a.activeFrames = 1; a.extreme = armAngle;
          a.upperArmMax = 0; a.upperArmSeen = false; a.dirJudged = 0;
          a.faultSince = 0; a.faultRunMax = 0; a.faultReason = ''; a.faultReasonSus = ''; a.partialDown = false;
          tally();
        }
      } else {
        a.activeFrames++;
